<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(79,142,247,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(79,142,247,.025) 1px,transparent 1px);background-size:52px 52px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#252535;border-radius:4px}
.label-xs{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.mono-val{font-family:'JetBrains Mono',monospace;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.03em;white-space:nowrap}
.pill-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

.opt-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,0,0,.45)}
.opt-btn.opt-A:hover:not(:disabled){border-color:rgba(79,142,247,.5)}

.opt-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;border:1px solid;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;flex-shrink:0}
.opt-result{border:1px solid #1e1e30;border-radius:14px;padding:18px 20px;transition:all .3s}
.pct-track{height:5px;border-radius:3px;background:#161620;overflow:hidden}
.pct-fill{height:100%;border-radius:3px;width:0;transition:width 1.3s cubic-bezier(0.22,1,.36,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.animate-slide-up{animation:slideUp .5s cubic-bezier(0.16,1,.3,1) both}
.delay-1{animation-delay:.08s}.delay-2{animation-delay:.16s}.delay-3{animation-delay:.24s}.delay-4{animation-delay:.32s}
@keyframes pulseStreak{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.3)}50%{box-shadow:0 0 0 5px rgba(245,166,35,0)}}
.streak-badge{animation:pulseStreak 3s ease-in-out infinite}

#side-modal.open{transform:translateX(0)}
@media(max-width:639px){#side-modal{width:100vw;border-left:none}}
#overlay{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}

.cmodal-overlay.open .cmodal-panel{transform:translateY(0) scale(1)}

.cmodal-body{overflow-y:auto;padding:22px 24px;flex:1;-webkit-overflow-scrolling:touch}

.chat-user{align-self:flex-end;max-width:88%;background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.22);border-radius:12px 12px 4px 12px;padding:9px 13px;color:#e0e0f8;line-height:1.55;animation:slideUp .3s ease both;word-break:break-word;font-size:12.5px}

.chat-ai strong{color:#d8d8f8;font-weight:600}.chat-ai em{color:#c4b5fd;font-style:italic}.chat-ai code{font-family:'JetBrains Mono',monospace;font-size:11px;background:#1a1a2e;padding:1px 5px;border-radius:3px}.chat-ai ul{padding-left:16px;margin:6px 0;list-style:disc}.chat-ai li{margin:3px 0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.s-cursor{display:inline-block;color:#a78bfa;animation:blink 1s step-end infinite;margin-left:1px}
.typing-dot{width:5px;height:5px;border-radius:50%;background:#a78bfa;display:inline-block;animation:tdot 1.3s ease-in-out infinite}
@keyframes tdot{0%,80%,100%{transform:scale(1);opacity:.5}40%{transform:scale(1.4);opacity:1}}
.chat-field{flex:1;resize:none;outline:none;background:#141420;border:1px solid #252535;border-radius:10px;color:#d8d8ec;font-size:13px;line-height:1.5;padding:9px 13px;font-family:inherit;transition:border-color .2s;max-height:100px}
.chat-field:focus{border-color:rgba(79,142,247,.45)}.chat-field::placeholder{color:#3a3a5a}
.send-btn{width:36px;height:36px;flex-shrink:0;border-radius:9px;border:none;background:linear-gradient(135deg,#4f8ef7,#7c3aed);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .18s}
.send-btn:hover{opacity:.85;transform:scale(1.05)}
.btn-deepen{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:11px;border:1px solid;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-share{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;border:1px solid #252535;background:transparent;color:#5a5a7a;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-share:hover{color:#c0c0e0;border-color:#404058}
.hdr-btn{width:30px;height:30px;border-radius:8px;background:#0c0c18;border:1px solid #1e1e30;color:#404060;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.hdr-btn:hover{color:#c0c0e0;border-color:#404058;background:#141420}
.hdr-btn.active{background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.35);color:#7bb3ff}
.hdr-btn.gen-btn{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.22);color:#34d399}
.hdr-btn.gen-btn:hover{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45)}
#toast-inner{display:flex;align-items:center;gap:8px;background:#181828;border:1px solid #303048;color:#e0e0f8;font-size:13px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;pointer-events:none}
#toast-inner.show{opacity:1;transform:translateY(0)}
kbd{display:inline-block;background:#141420;border:1px solid #252535;border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:9px;color:#4a4a6a}
.nav-dot{border-radius:999px;border:none;cursor:pointer;transition:all .3s cubic-bezier(0.16,1,.3,1);background:#252535}
.nav-dot:hover{background:#404058}
.nav-dot.active{width:22px;height:7px;background:#e0e0f8}
.nav-dot.done{width:7px;height:7px;background:#4f8ef7}
.nav-dot.generated{width:7px;height:7px;background:#34d399}
.nav-dot.idle{width:7px;height:7px}
.concept-box{background:#0c0c18;border:1px solid #1e1e30;border-radius:12px;padding:14px 16px}
.tl-connector{width:1px;flex:1;margin-top:3px;background:#1e1e30}
.article-highlight{border-left:2px solid;padding:4px 0 4px 14px}
.settings-input{width:100%;background:#111120;border:1px solid #252535;border-radius:10px;color:#d8d8ec;font-size:13px;padding:10px 14px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .2s}
.settings-input:focus{border-color:rgba(79,142,247,.5)}.settings-input::placeholder{color:#2a2a40}
.provider-tab{flex:1;padding:8px 12px;border-radius:8px;border:1px solid #252535;background:transparent;color:#5a5a7a;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.provider-tab.active{background:rgba(79,142,247,.12);border-color:rgba(79,142,247,.35);color:#7bb3ff}
.gear-btn{width:26px;height:26px;border-radius:7px;background:#141420;border:1px solid #252535;color:#404060;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.gear-btn:hover{color:#a0a0c0;border-color:#404058}
.gear-btn.configured{border-color:rgba(52,211,153,.3);color:#34d399;background:rgba(52,211,153,.06)}
.demo-banner{display:flex;align-items:center;gap:8px;background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.18);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11.5px;color:#9a7a3a;line-height:1.4}
.domain-bar-track{height:6px;border-radius:3px;background:#0e0e1c;overflow:hidden;flex:1}
.domain-bar-fill{height:100%;border-radius:3px;width:0%;transition:width 1.2s cubic-bezier(0.22,1,.36,1)}
.theme-chip{padding:6px 14px;border-radius:999px;border:1px solid #252535;background:#0c0c18;color:#5a5a7a;font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.theme-chip:hover,.theme-chip.selected{background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.35);color:#7bb3ff}
@keyframes genSpin{to{transform:rotate(360deg)}}
.gen-spinner{width:32px;height:32px;border:2px solid #1e1e30;border-top-color:#4f8ef7;border-radius:50%;animation:genSpin .8s linear infinite}
#confetti-canvas{position:fixed;inset:0;z-index:500;pointer-events:none}
/* ── FILTER BAR ── */
.filter-bar-wrap{position:sticky;top:58px;z-index:49;backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.04);background:rgba(8,8,16,.92);display:flex;align-items:center;padding:0 4px}
.scroll-arrow{background:linear-gradient(90deg, rgba(8,8,16,1) 30%, rgba(8,8,16,0));border:none;color:#505070;cursor:pointer;padding:8px 6px;height:100%;z-index:2;transition:color .2s}
.scroll-arrow:hover{color:#d8d8f0}
.scroll-arrow.right{background:linear-gradient(270deg, rgba(8,8,16,1) 30%, rgba(8,8,16,0))}
.filter-bar{display:flex;gap:6px;padding:9px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:672px;margin:0 auto;scroll-behavior:smooth;cursor:grab}
.filter-bar:active{cursor:grabbing}
.filter-bar::-webkit-scrollbar{display:none}
.filter-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;border:1px solid #1e1e30;background:#0c0c18;color:#404060;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .22s;font-family:'Inter',sans-serif;flex-shrink:0}
.filter-pill:hover{border-color:#404058;color:#c0c0e0;background:#141420}
.filter-pill.active{background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.4);color:#7bb3ff}
.filter-count{font-size:10px;font-family:'JetBrains Mono',monospace;opacity:.55;margin-left:1px}
/* ── GLOSSARY ── */
.glossary-term{border-bottom:1px dashed rgba(167,139,250,.35);cursor:pointer;color:inherit;transition:border-color .2s,color .2s;position:relative}
.glossary-term:hover,.glossary-term:focus{border-bottom-color:rgba(167,139,250,.7);color:#c4b5fd;outline:none}
#glossary-popover{position:fixed;z-index:800;width:260px;background:#111120;border:1px solid rgba(167,139,250,.28);border-radius:14px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;transform:translateY(4px)}
#glossary-popover.visible{opacity:1;pointer-events:all;transform:translateY(0)}
.gp-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#a78bfa;margin-bottom:7px}
.gp-def{color:#8888aa;font-size:12.5px;line-height:1.6}
.gp-close{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;background:#1e1e30;border:none;color:#505070;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.gp-close:hover{color:#d0d0f0;background:#2a2a40}

.hook-box{background:rgba(79,142,247,.05);border:1px solid rgba(79,142,247,.15);border-radius:12px;padding:13px 16px;margin-bottom:16px}
.hook-box-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#4f8ef7;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.hook-box-text{color:#6a7a9a;font-size:13px;line-height:1.65;font-style:italic}
/* ── REVELATION 3-2-1 ── */
.rev-block{border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rev-block.what{background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.14)}
.rev-block.cost{background:rgba(248,113,113,.05);border:1px solid rgba(248,113,113,.14)}
.rev-block.model{background:rgba(245,166,35,.05);border:1px solid rgba(245,166,35,.14)}
.rev-block-label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.rev-block-text{font-size:13.5px;line-height:1.7}
/* ── QUIZ ── */
.quiz-wrap{background:#0c0c18;border:1px solid #1e1e30;border-radius:14px;padding:18px 20px;margin-top:12px}
.quiz-title{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#f5a623;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.quiz-q{color:#d8d8f0;font-size:14px;font-weight:600;line-height:1.45;margin-bottom:14px;letter-spacing:-.15px}
.quiz-opt{width:100%;text-align:left;background:#111120;border:1px solid #1e1e30;border-radius:10px;padding:11px 14px;color:#6a6a8a;font-size:13px;cursor:pointer;transition:all .2s;line-height:1.45;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px}
.quiz-opt:last-child{margin-bottom:0}
.quiz-opt:hover:not(:disabled){border-color:#404058;color:#c0c0e0;background:#161620}
.quiz-opt:disabled{cursor:default}
.quiz-opt.correct{background:rgba(52,211,153,.08)!important;border-color:rgba(52,211,153,.35)!important;color:#34d399!important}
.quiz-opt.wrong{background:rgba(248,113,113,.08)!important;border-color:rgba(248,113,113,.28)!important;color:#f87171!important}
.quiz-opt .ql{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;opacity:.7}
.quiz-feedback{font-size:12px;margin-top:10px;padding:9px 12px;border-radius:8px;line-height:1.55}
.quiz-feedback.correct{background:rgba(52,211,153,.08);color:#4ecc94;border:1px solid rgba(52,211,153,.2)}
.quiz-feedback.wrong{background:rgba(248,113,113,.08);color:#f09090;border:1px solid rgba(248,113,113,.2)}
.quiz-done-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px}
/* ── XP BADGE ── */
.xp-badge{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:#f5a623;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.2);padding:4px 10px;border-radius:999px;flex-shrink:0}
@keyframes xpPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.xp-pop{animation:xpPop .4s ease}

.mm-card{background:#0c0c18;border:1px solid #1e1e30;border-radius:12px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px;transition:border-color .2s}

.mm-icon{font-size:20px;flex-shrink:0;line-height:1}
.mm-name{color:#e0e0f0;font-weight:600;font-size:13px;margin-bottom:3px}

.unlock-animate{animation:unlockGlow .6s ease-out}

.view-container{position:relative;width:100%;height:100%}
.app-view{position:absolute;top:0;left:0;width:100%;opacity:0;pointer-events:none;transform:translateY(15px);transition:opacity .35s ease, transform .35s ease}
.app-view.active{position:relative;opacity:1;pointer-events:all;transform:translateY(0);z-index:2}

.hub-card{background:#0c0c18;border:1px solid #1e1e30;border-radius:14px;padding:16px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;justify-content:space-between;height:100%}

.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.cat-card{background:#080810;border:1px solid #151525;border-radius:10px;padding:12px;cursor:pointer;transition:border-color .2s;text-align:left}
.cat-card:hover{border-color:#3a3a50;background:#0c0c18}

/* ═══ HELPERS ═══ */
function stripHtml(s){ return (s||'').replace(/<[^>]+>/g,''); }
function parseMarkdown(text){
  let h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines=h.split('\n'); let out=[],inList=false;
  for(const ln of lines){
    if(/^[-•]\s/.test(ln)){ if(!inList){out.push('<ul>');inList=true;} out.push(`<li>${ln.slice(2)}</li>`); }
    else{ if(inList){out.push('</ul>');inList=false;} out.push(ln); }
  }
  if(inList) out.push('</ul>');
  return out.join('\n').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');
}
function showToast(text,icon='✓',ms=2800){
  const el=document.getElementById('toast-inner');
  document.getElementById('toast-icon').textContent=icon;
  document.getElementById('toast-text').textContent=text;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>el.classList.remove('show'),ms);
}
function closeBtn(fn){ return `<button onclick="${fn}" style="width:28px;height:28px;border-radius:8px;background:#141420;border:1px solid #252535;color:#404060;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0" onmouseover="this.style.color='#d0d0f0'" onmouseout="this.style.color='#404060'"><svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>`; }

/* ═══ AUDIO FX ═══ */
const AudioFX=(()=>{
  let _ctx=null;
  function ctx(){ if(!_ctx)try{_ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){} return _ctx; }
  function click(){ const c=ctx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(900,c.currentTime);o.frequency.exponentialRampToValueAtTime(220,c.currentTime+.06);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.start();o.stop(c.currentTime+.09);}catch(_){} }
  function select(){ const c=ctx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(520,c.currentTime);g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.2);}catch(_){} }
  function victory(){ const c=ctx();if(!c)return;[[440,0],[554,.08],[659,.16],[880,.26]].forEach(([f,d])=>{try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(f,c.currentTime+d);g.gain.setValueAtTime(0,c.currentTime+d);g.gain.linearRampToValueAtTime(.07,c.currentTime+d+.05);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.9);o.start(c.currentTime+d);o.stop(c.currentTime+d+.9);}catch(_){}});}
  function wrong(){ const c=ctx();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.exponentialRampToValueAtTime(120,c.currentTime+.18);g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.start();o.stop(c.currentTime+.22);}catch(_){} }
  function quiz_correct(){ const c=ctx();if(!c)return;[[523,.0],[659,.1],[784,.2]].forEach(([f,d])=>{try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(f,c.currentTime+d);g.gain.setValueAtTime(0,c.currentTime+d);g.gain.linearRampToValueAtTime(.09,c.currentTime+d+.04);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.5);o.start(c.currentTime+d);o.stop(c.currentTime+d+.5);}catch(_){}});}
  return { click,select,victory,wrong,quiz_correct };
})();

/* ═══ CONFETTI ═══ */
const Confetti=(()=>{
  let animId=null;
  const COLORS=['#4f8ef7','#a78bfa','#34d399','#f5a623','#f0f0ff','#f87171'];
  function burst(){ const canvas=document.getElementById('confetti-canvas');if(!canvas)return;canvas.style.display='block';canvas.width=window.innerWidth;canvas.height=window.innerHeight;const ctx2d=canvas.getContext('2d');if(animId){cancelAnimationFrame(animId);animId=null;}
    const particles=Array.from({length:70},()=>({x:window.innerWidth*(.2+Math.random()*.6),y:-10-Math.random()*40,vx:(Math.random()-.5)*5,vy:Math.random()*3+1.5,color:COLORS[Math.floor(Math.random()*COLORS.length)],size:Math.random()*7+3,rotation:Math.random()*360,rotV:(Math.random()-.5)*10,shape:Math.random()>.5?'rect':'circle'}));
    function frame(){ctx2d.clearRect(0,0,canvas.width,canvas.height);let alive=false;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.rotation+=p.rotV;if(p.y<canvas.height+20){alive=true;const alpha=Math.max(0,1-p.y/canvas.height*1.1);ctx2d.save();ctx2d.translate(p.x,p.y);ctx2d.rotate(p.rotation*Math.PI/180);ctx2d.globalAlpha=alpha;ctx2d.fillStyle=p.color;if(p.shape==='circle'){ctx2d.beginPath();ctx2d.arc(0,0,p.size/2,0,Math.PI*2);ctx2d.fill();}else{ctx2d.fillRect(-p.size/2,-p.size*.3,p.size,p.size*.6);}ctx2d.restore();}}
    if(alive)animId=requestAnimationFrame(frame);else canvas.style.display='none';}
    animId=requestAnimationFrame(frame);setTimeout(()=>{if(animId){cancelAnimationFrame(animId);animId=null;canvas.style.display='none';}},4000);}
  return { burst };
})();

const Filter=(()=>{
  const CATEGORIES=[
    {key:'all',      label:'✦ Todos',                match:()=>true},
    {key:'macro',    label:'🏛️ Macro & Dinero',       match:d=>d.category.toLowerCase().includes('macro')||d.category.toLowerCase().includes('global')},
    {key:'filosofia',label:'🦅 Filosofía del Poder',  match:d=>d.category.toLowerCase().includes('filosof')},
    {key:'geo',      label:'☢️ Geopolítica & Conflicto',match:d=>d.category.toLowerCase().includes('geopol')||d.category.toLowerCase().includes('nuclear')||d.category.toLowerCase().includes('militar')},
    {key:'finanzas', label:'💸 Finanzas & Riesgo',    match:d=>d.category.toLowerCase().includes('finanz')||d.category.toLowerCase().includes('riesgo')||d.category.toLowerCase().includes('mercad')},
    {key:'psicologia',label:'🧠 Psicología & Sesgos', match:d=>d.category.toLowerCase().includes('psicol')||d.category.toLowerCase().includes('sesgo')||d.category.toLowerCase().includes('cogn')},

    {key:'politica', label:'🏛️ Política & Estado',   match:d=>d.category.toLowerCase().includes('política')||d.category.toLowerCase().includes('estado')||d.category.toLowerCase().includes('revoluci')},
  ];
  let active='all';
  function getCategories(){return CATEGORIES;} function getActive(){return active;} function setActive(k){active=k;}
  function getFiltered(){const all=DB.getAll(),cat=CATEGORIES.find(c=>c.key===active)||CATEGORIES[0];return all.filter(cat.match);}
  function currentFilteredIdx(){const all=DB.getAll(),filtered=getFiltered(),d=all[State.get().idx];return filtered.indexOf(d);}

  return {getCategories,getActive,setActive,getFiltered,currentFilteredIdx,globalIdxOf,countPerCategory};
})();

/* ═══ GLOSSARY ═══ */
const Glossary=(()=>{
  const DATA={
    'estanflación':'Cuando los precios suben (inflación) Y la economía se frena con desempleo al mismo tiempo. Lo peor de dos mundos económicos.',
    'inflación':'Cuando el dinero pierde valor: los mismos productos cuestan más cada año. Si sube muy rápido, destruye los ahorros.',
    'tasas de interés':'El costo de pedir dinero prestado. La Fed las sube para "enfriar" la economía y bajar la inflación.',
    'reserva federal':'El banco central de EE.UU. Controla cuánto dinero circula y a qué precio se presta.',
    'patrón oro':'Sistema donde cada billete puede cambiarse por una cantidad fija de oro. Nixon lo eliminó en 1971.',
    'bretton woods':'Acuerdo de 1944 entre 44 países: el dólar ligado al oro a $35/oz.',
    'petrodólar':'El acuerdo de que el petróleo mundial se vende en dólares, dándole valor global al dólar sin respaldo en oro.',
    'apalancamiento':'Invertir con dinero prestado. Amplifica ganancias si sale bien, pero también multiplica pérdidas.',
    'derivados':'Contratos financieros cuyo valor depende del precio de otro activo. Muy complejos y pueden amplificar pérdidas masivas.',
    'riesgo moral':'Cuando alguien toma más riesgos sabiendo que otros pagarán las consecuencias. El "no me importa, me rescatan".',
    'too big to fail':'Tan grande que si colapsa arrastra a todo el sistema. Por eso el gobierno lo rescata aunque le cueste caro.',
    'hedge fund':'Fondo de inversión privado exclusivo que usa estrategias complejas y de alto riesgo buscando rendimientos muy altos.',
    'inconsistencia temporal':'La tendencia de los gobiernos a prometer estabilidad y luego romper esa promesa cuando les conviene.',
    'trilema':'Situación donde hay tres objetivos deseables pero solo se pueden lograr dos a la vez. Siempre hay que sacrificar uno.',
    'brinksmanship':'Llevar al adversario al límite absoluto del abismo para forzarlo a rendirse antes de caer.',
    'chicken game':'El juego del gallina: dos partes al choque. Quien se aparte primero "pierde", pero si ninguno lo hace, ambos pierden todo.',
    'bloqueo naval':'Cerrar una zona marítima con barcos de guerra para impedir que entren o salgan embarcaciones.',
    'disuasión nuclear':'Estrategia de paz por miedo mutuo: "Si me atacas, tú también te destruyes."',
    'realpolitik':'Política exterior basada en intereses de poder real, no en valores morales. "Lo que conviene", no "lo que es justo".',
    'virtù':'Para Maquiavelo: la habilidad de un líder de actuar con decisión para doblegar las circunstancias a su favor.',
    'contrato social':'El acuerdo teórico entre ciudadanos y estado: cedo libertades a cambio de seguridad y servicios.',
    'leviatán':'Para Hobbes: el estado con poder absoluto, único capaz de garantizar paz y orden.',
    'derechos naturales':'Para Locke: los derechos que tenemos por ser humanos, no por ley: vida, libertad y propiedad.',
    'estado de naturaleza':'Para Hobbes: el caos sin gobierno — vida "solitaria, pobre, brutal y corta". Sin reglas, todos contra todos.',
    'costo hundido':'Dinero o tiempo ya gastado e irrecuperable. No debería influir en decisiones futuras, pero nuestro cerebro lo ignora.',
    'prospect theory':'La teoría que explica que las pérdidas duelen 2.5 veces más que los beneficios equivalentes.',
    'sesgo cognitivo':'Un error sistemático del pensamiento que lleva a juicios o decisiones irracionales pero predecibles.',
    'disrupción innovadora':'Cuando una tecnología inferior pero más accesible desplaza a la superior establecida. Blockbuster vs Netflix.',
    'dilema del innovador':'La paradoja de que el éxito de una empresa le impide adoptar las innovaciones que amenazarán su negocio.',
  };
  function _process(html){
    const terms=Object.keys(DATA).sort((a,b)=>b.length-a.length);
    let result=html;
    for(const term of terms){
      const def=DATA[term],escaped=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      let found=false;
      const defQ=def.replace(/"/g,'&quot;');
      result=result.replace(/(<[^>]+>)|([^<]*)/g,(m,tag,text)=>{
        if(tag) return tag;
        if(!text||found) return text||'';
        const rx=new RegExp('(?<![\\w-])'+escaped+'(?![\\w-])','i');
        return text.replace(rx,match=>{found=true;return `<span class="glossary-term" data-def="${defQ}" data-term="${term}" onclick="Glossary.show(this)" tabindex="0" role="button">${match}</span>`;});
      });
    }
    return result;
  }
  function annotate(html){return _process(html);}
  function show(el){
    const pop=document.getElementById('glossary-popover');if(!pop)return;
    document.getElementById('gp-term').textContent=el.dataset.term||el.textContent;
    document.getElementById('gp-def').textContent=el.dataset.def||'';
    const rect=el.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight;
    const pw=268,ph=100;let left=rect.left,top=rect.bottom+8;
    if(left+pw>W-12)left=W-pw-12;if(left<12)left=12;
    if(top+ph>H-12)top=rect.top-ph-8;if(top<12)top=12;
    pop.style.left=left+'px';pop.style.top=top+'px';pop.classList.add('visible');
    setTimeout(()=>{function outside(e){if(!pop.contains(e.target)&&e.target!==el){hide();document.removeEventListener('click',outside,true);}}document.addEventListener('click',outside,true);},10);
  }
  function hide(){document.getElementById('glossary-popover')?.classList.remove('visible');}
  return {annotate,show,hide};
})();

/* ═══ LLM (Streaming + Generator) ═══ */
const LLM={
  buildSystemPrompt(d,userChoice){
    const opt=d.options[userChoice],rev=d.revelation,ok=userChoice===rev.historicalChoice;
    return `Eres un asesor intelectual del período ${d.year}, especializado en ${d.category}. Rol: pensador crítico y socrático, NO asistente complaciente.\n\nCONTEXTO (${d.year}, ${d.country}):\n${stripHtml(d.context)}\n\nEL USUARIO ELIGIÓ: Opción ${userChoice} — "${opt.label}": ${opt.desc}\n\nLO QUE OCURRIÓ: ${rev.actor} eligió la Opción ${rev.historicalChoice} — "${rev.choiceLabel}". ${stripHtml(rev.text)}\n\nCONCEPTO CLAVE: ${rev.concept} — ${stripHtml(rev.conceptExp)}\n\n${ok?`ACERTÓ. Desafía los costos colaterales reales. ¿Qué se sacrificó? Profundiza.`:`NO ACERTÓ. Rebate con argumentos históricos concretos. Explica la lógica real.`}\n\nREGLAS: Máximo 3 párrafos. Usa **negritas** para conceptos clave. Termina SIEMPRE con pregunta socrática. NUNCA frases genéricas. Responde en español.`;
  },
  buildGeneratorPrompt(theme){
    return `Genera un dilema histórico educativo para una app de microaprendizaje. Responde SOLO con JSON válido (sin markdown). Tema: "${theme}"\n\n{"id":"slug-año","category":"Categoría","catKey":"blue|purple|red|amber|green","year":"AÑO","country":"País","icon":"emoji","title":"Título dramático","subtitle":"Subtítulo","hook":"Analogía cotidiana que cualquier novato entienda","context":"2-3 frases con <strong> y <em>","stats":[{"value":"X","label":"L","col":"#color"}],"options":{"A":{"label":"L","desc":"D","pct":45},"B":{"label":"L","desc":"D","pct":55}},"revelation":{"historicalChoice":"A|B","choiceLabel":"L","actor":"Actor","text":"Qué pasó","hiddenCost":"El costo oculto no obvio","mentalModelLife":"La regla aplicable hoy","concept":"Concepto","conceptAuthors":"Autor · Obra, Año","conceptExp":"Explicación","metrics":[{"value":"V","label":"L","col":"#color"}]},"article":{"title":"T","readTime":"3 min","sections":[{"h":"Título","p":"Contenido","hl":false}],"timeline":[{"date":"D","text":"T","col":"#color"}]},"quiz":{"question":"Pregunta sobre el concepto","options":[{"text":"Opción falsa","correct":false,"feedback":"Por qué no"},{"text":"Opción correcta","correct":true,"feedback":"Por qué sí"},{"text":"Opción falsa","correct":false,"feedback":"Por qué no"}],"xp":10},"chat":{"starter":"Pregunta socrática inicial","responses":["R1","R2","R3","R4"]}}\n\nMUY IMPORTANTE: SIEMPRE incluye los campos 'hook' y 'quiz' exactamente con este formato. Todo en español, históricamente preciso, moralmente complejo.`;
  },
  async _readStream(response,onChunk,onDone,onError,parseChunk){
    try{const reader=response.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done){onDone();break;}buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();for(const line of lines){if(!line.startsWith('data: '))continue;const data=line.slice(6).trim();if(data==='[DONE]'){onDone();return;}if(!data)continue;try{const chunk=parseChunk(JSON.parse(data));if(chunk)onChunk(chunk);}catch(_){}}}}catch(e){onError(e.message);}
  },
  async streamGemini(cfg,messages,systemPrompt,onChunk,onDone,onError){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:streamGenerateContent?alt=sse&key=${cfg.apiKey}`;

     hiddenCost:'El costo oculto de continuar no es solo el millón adicional. Es el tiempo de tu equipo, las oportunidades alternativas perdidas, y lo más caro: la señal que mandas a tu organización de que el dinero gastado justifica malas decisiones futuras.',
     mentalModelLife:'"Los $2M ya están perdidos, estés o no en el proyecto." Si tu única razón para continuar es lo que ya gastaste, estás atrapado en la Falacia del Costo Hundido. Pregunta correcta: ¿invertiría $1M HOY en este proyecto si empezara desde cero? Si la respuesta es no, ciérralo.',
     concept:'Falacia del Costo Hundido',conceptAuthors:'Kahneman & Tversky · Prospect Theory, 1979 · Nobel 2002',
     conceptExp:'El cerebro valora las pérdidas 2.5 veces más que las ganancias equivalentes (Prospect Theory). Esto nos lleva a tomar decisiones irracionales: invertir más en proyectos fallidos, no vender acciones en pérdida, no terminar relaciones dañinas. El antídoto: "zero-based thinking".',
     metrics:[{value:'2.5x',label:'Las pérdidas duelen más',col:'#a78bfa'},{value:'Nobel',label:'Economía 2002',col:'#4f8ef7'}]},
   article:{title:'La Mente que Votó en Contra Tuya',readTime:'3 min',
     sections:[
       {h:'Cuando la lógica y el cerebro chocan',p:'Imagina dos opciones: A) Ganar $500 seguros. B) 50% de ganar $1000 o 50% de no ganar nada. Matemáticamente iguales. Pero el 84% elige A — prefieren la certeza aunque el valor esperado sea idéntico.',hl:false},
       {h:'Las pérdidas duelen 2.5 veces más',p:'Kahneman y Tversky descubrieron que la mente valora las pérdidas desproporcionadamente. Perder $100 duele más que ganar $100 alegra. Esta asimetría lleva a decisiones irracionales: aferrarse a lo que tenemos aunque sea costoso.',hl:true},
       {h:'La Falacia del Costo Hundido en tu empresa',p:'El Pentágono gastó $30B en el F-35 antes de admitir problemas estructurales. El Concorde continuó años después de saber que sería un fracaso comercial — por eso también se llama "Efecto Concorde".',hl:false},
       {h:'Legado: la economía conductual',p:'Prospect Theory fundó la Economía Conductual y ganó el Nobel en 2002. Cambió cómo los gobiernos diseñan políticas y cómo los inversores gestionan carteras.',hl:false},

     timeline:[{date:'1974',text:'Kahneman y Tversky publican "Heuristics and Biases".',col:'#4f8ef7'},{date:'1979',text:'Prospect Theory publicada. Fundamento de la economía conductual.',col:'#a78bfa'},{date:'2002',text:'Kahneman recibe el Nobel. Tversky había fallecido en 1996.',col:'#34d399'},{date:'2008',text:'La crisis financiera demuestra que los mercados NO son racionales.',col:'#f87171'},{date:'2011',text:'"Thinking, Fast and Slow" se convierte en bestseller global.',col:'#4f8ef7'}]},

       {text:'Porque siempre es mejor rendirse que persistir en algo difícil',correct:false,feedback:'No siempre — la clave es si el proyecto tiene futuro real, no cuánto ya gastaste. Perseverar con buenas razones sí vale.'},
       {text:'Porque el fracaso siempre da experiencia suficientemente valiosa',correct:false,feedback:'La experiencia es un beneficio, pero no justifica invertir más solo porque ya gastaste. La razón para continuar debe ser el potencial futuro.'},

   chat:{starter:'Acabas de descubrir la Falacia del Costo Hundido. ¿Hay situaciones donde la persistencia se justifica racionalmente, incluso cuando las probabilidades están en tu contra?',
     responses:['La Falacia del Costo Hundido no significa siempre rendirse. Significa que la razón para continuar NO puede ser "ya gasté demasiado". Las razones válidas para persistir: el proyecto mejoró su perspectiva, hay nueva información positiva, o el costo de terminar supera el de continuar.','Nassim Taleb tiene una variante contraria: la "Lindy Effect". Cuanto más tiempo ha sobrevivido algo, más probable es que siga sobreviviendo. La persistencia tiene valor informativo. ¿Cómo reconcilias esto con la Falacia del Costo Hundido?','El "zero-based thinking" de Brian Tracy: "¿Tomaría esta decisión de nuevo, sabiendo lo que sé ahora?" Si la respuesta honesta es no, deberías salir tan pronto como sea posible. Aplicado: ¿tomarías este trabajo otra vez? ¿Esta inversión?','Los experimentos de Kahneman muestran que los expertos (médicos, jueces, inversores) cometen exactamente los mismos sesgos que los novatos — solo con más confianza. ¿Cómo diseñas sistemas para protegerte de tus propios sesgos?']}},

/* ═══ STATE (with XP + Quiz) ═══ */
const State=(()=>{
  const KEY='dopaminapp_v5_state';
  let s={idx:0,completed:{},streak:{count:0,last:null},xp:0,quizzes:{}};
  function _today(){return new Date().toISOString().slice(0,10);}
  function load(){
    try{const r=localStorage.getItem(KEY);if(r)s={...s,...JSON.parse(r)};}catch(_){}
    if(s.streak.last){const diff=(new Date(_today())-new Date(s.streak.last))/86400000;if(diff>1){s.streak.count=0;s.streak.last=null;_save();}}
    return s;
  }
  function _save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(_){}}
  function complete(id,choice){
    if(s.completed[id])return;
    s.completed[id]={choice,ts:Date.now()};
    const today=_today();if(s.streak.last!==today){s.streak.count++;s.streak.last=today;}
    _save();
  }
  function isDone(id){return !!s.completed[id];}
  function getChoice(id){return s.completed[id]?.choice||null;}
  function get(){return s;}
  function setIdx(i){s.idx=i;_save();}
  function passQuiz(id,selectedIdx){
    if(s.quizzes[id]) return false;
    s.quizzes[id]={passed:true,selectedIdx,ts:Date.now()};
    s.xp=(s.xp||0)+10;
    _save(); return true;
  }
  function failQuiz(id,selectedIdx){
    if(!s.quizzes[id]) s.quizzes[id]={passed:false,selectedIdx,ts:Date.now()};
    _save();
  }
  function isQuizDone(id){return !!s.quizzes[id];}
  function isQuizPassed(id){return !!(s.quizzes[id]?.passed);}
  function getXP(){return s.xp||0;}
  function getUnlockedModels(){
    return Object.keys(s.quizzes||{}).filter(id=>s.quizzes[id]?.passed).map(id=>DB.findById(id)).filter(Boolean).map(d=>({id:d.id,concept:d.revelation.concept,conceptAuthors:d.revelation.conceptAuthors,conceptExp:d.revelation.conceptExp,icon:d.icon,category:d.category,catKey:d.catKey,mentalModelLife:d.revelation.mentalModelLife}));
  }
  function reset(){s={idx:0,completed:{},streak:{count:0,last:null},xp:0,quizzes:{}};_save();}
  return {load,complete,isDone,getChoice,get,setIdx,passQuiz,failQuiz,isQuizDone,isQuizPassed,getXP,getUnlockedModels,reset};
})();

  compute(){
    const all=DB.getAll(),completed=all.filter(d=>State.isDone(d.id));
    if(completed.length===0) return null;
    let boldCount=0,accurateCount=0;
    const domainData={};for(const dom of this.DOMAINS)domainData[dom.key]={done:0,accurate:0,total:0};
    for(const d of all){
      for(const dom of this.DOMAINS)if(dom.ids.includes(d.id))domainData[dom.key].total++;
      if(!State.isDone(d.id))continue;
      const choice=State.getChoice(d.id);
      if(choice==='B')boldCount++;if(choice===d.revelation.historicalChoice)accurateCount++;
      for(const dom of this.DOMAINS)if(dom.ids.includes(d.id)){domainData[dom.key].done++;if(choice===d.revelation.historicalChoice)domainData[dom.key].accurate++;}
    }
    const total=completed.length,boldness=Math.round((boldCount/total)*100),accuracy=Math.round((accurateCount/total)*100);
    const archetype=this.ARCHETYPES.find(a=>a.cond(boldness,accuracy))||this.ARCHETYPES[4];
    return {total,boldness,accuracy,archetype,domainData};
  },
};

  _animateBars(d){
    ['A','B'].forEach(opt=>{
      const bar=document.getElementById(`pct-${opt}-bar`),num=document.getElementById(`pct-${opt}-num`);if(!bar||!num)return;
      const target=parseInt(bar.dataset.target);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width=target+'%';}));
      let start=null;function step(ts){if(!start)start=ts;const p=Math.min((ts-start)/1300,1),e=1-Math.pow(1-p,4);num.textContent=Math.round(e*target)+'%';if(p<1)requestAnimationFrame(step);else num.textContent=target+'%';}
      setTimeout(()=>requestAnimationFrame(step),80);
    });
  },

  _quizBlock(d){
    if(!d.quiz) return '';

          <span class="ql">${String.fromCharCode(65+i)}</span>${o.text}

      }).join('');
      return`<div class="quiz-wrap" style="border-color:${passed?'rgba(52,211,153,.22)':'rgba(248,113,113,.18)'}">

/* ═══ APP CONTROLLER ═══ */
const App={
  _chatIdx:0,_modalOpen:false,_chatHistory:[],_streaming:false,_genTheme:'',_currentView:'hub',

  init(){
    State.load();Config.load();
    try{Render.filterBar();}catch(e){}
    try{Render.header();}catch(e){}
    Render.hub();
    Render.dilemma();
    this.showHub();
    this._bindKeys();
    this._bindMobileViewport();
  },

  showHub(){
    this._currentView = 'hub';
    const hub = document.getElementById('hub-view');
    const game = document.getElementById('dilemma-view');
    const fbar = document.getElementById('filter-bar-container');
    if(hub) hub.classList.add('active');
    if(game) game.classList.remove('active');
    if(fbar) fbar.style.display = 'none';
    Render.hub();
  },

  showGame(){
    this._currentView = 'game';
    const hub = document.getElementById('hub-view');
    const game = document.getElementById('dilemma-view');
    const fbar = document.getElementById('filter-bar-container');
    if(hub) hub.classList.remove('active');
    if(game) game.classList.add('active');
    if(fbar) fbar.style.display = 'flex';
  },

  goTo(i){
    if(this._currentView === 'hub') this.showGame();
    const all=DB.getAll();if(i<0||i>=all.length||i===State.get().idx)return;
    Glossary.hide();State.setIdx(i);this._chatIdx=0;this._chatHistory=[];Render.dilemma();AudioFX.click();
  },

  navigate(dir){
    const filtered=Filter.getFiltered(),all=DB.getAll(),fi=Filter.currentFilteredIdx(),newFi=fi+dir;
    if(newFi>=0&&newFi<filtered.length){const gi=all.indexOf(filtered[newFi]);if(gi>=0)this.goTo(gi);}
  },

  setFilter(key){
    Filter.setActive(key);const filtered=Filter.getFiltered();if(filtered.length===0){Render.filterBar();return;}
    const all=DB.getAll(),currentD=all[State.get().idx];
    if(!filtered.includes(currentD)){const gi=all.indexOf(filtered[0]);State.setIdx(gi);this._chatHistory=[];this._chatIdx=0;if(this._modalOpen)this.closeModal();Render.dilemma();}
    else{Render.header();Render.filterBar();}
    AudioFX.click();
  },

  selectOption(opt){
    const all=DB.getAll(),{idx}=State.get(),d=all[idx];if(State.isDone(d.id))return;
    AudioFX.select();State.complete(d.id,opt);
    const optArea=document.getElementById('options-area'),revArea=document.getElementById('revelation-area');
    if(!optArea||!revArea)return;
    optArea.style.transition='opacity .22s';optArea.style.opacity='0';
    setTimeout(()=>{
      optArea.innerHTML=Render._optionsDone(d,opt);optArea.style.opacity='1';Render._animateBars(d);
      revArea.innerHTML=Render._revelation(d,opt);Render.header();
      const ok=opt===d.revelation.historicalChoice;
      if(ok){AudioFX.victory();Confetti.burst();document.getElementById('dilemma-card')?.classList.add('victory-pulse');}
      else{AudioFX.wrong();}
      showToast(ok?`✓ Acertaste con ${d.revelation.actor}!`:'📖 Mira la revelación histórica',ok?'🎯':'📖');
    },230);
  },

  answerQuiz(id,optionIdx){
    const d=DB.findById(id);if(!d?.quiz||State.isQuizDone(id))return;
    const option=d.quiz.options[optionIdx],correct=option.correct;
    if(correct){
      const isNew=State.passQuiz(id,optionIdx);
      AudioFX.quiz_correct();
      if(isNew){
        showToast(`+10 XP — ${d.revelation.concept} dominado!`,'⚡');
        const xpEl=document.getElementById('xp-display');if(xpEl){xpEl.style.display='flex';xpEl.classList.add('xp-pop');setTimeout(()=>xpEl.classList.remove('xp-pop'),500);}
        const xpCount=document.getElementById('xp-count');if(xpCount)xpCount.textContent=State.getXP();
      }
    } else {
      State.failQuiz(id,optionIdx);AudioFX.wrong();
      showToast('No exactamente — lee el feedback abajo','💡');
    }
    // Re-render quiz in place
    const quizEl=document.getElementById(`quiz-${id}`);
    if(quizEl){
      // Show answer feedback inline
      const opts=d.quiz.options.map((o,i)=>{
        let cls='';if(i===optionIdx&&correct)cls='correct';else if(i===optionIdx&&!correct)cls='wrong';else if(o.correct)cls='correct';
        return`<div class="quiz-opt ${cls}" style="pointer-events:none;opacity:${cls?1:.4}"><span class="ql">${String.fromCharCode(65+i)}</span>${o.text}${cls==='correct'?'<span style="margin-left:auto">✓</span>':cls==='wrong'?'<span style="margin-left:auto">✗</span>':''}</div>`;
      }).join('');
      quizEl.innerHTML=`<p class="quiz-title" style="color:${correct?'#34d399':'#f87171'}">${correct?'✓ ¡Correcto!  +10 XP':'✗ No exactamente'}</p>
        <p class="quiz-q">${d.quiz.question}</p>${opts}
        <div class="quiz-feedback ${correct?'correct':'wrong'}">${option.feedback}</div>`;
      quizEl.style.borderColor=correct?'rgba(52,211,153,.3)':'rgba(248,113,113,.25)';
      if(correct)quizEl.classList.add('unlock-animate');
    }
    Render.header();
  },

  /* ── Flashcards ── */
  openFlashcard(id){
    const d=DB.findById(id); if(!d)return;
    AudioFX.click();
    Render.flashcard(d);
  },
  closeFlashcard(){
    const el=document.getElementById('flashcard-overlay');
    if(el){el.classList.remove('open'); AudioFX.click();}
  },
  answerFlashcard(id, optionIdx){
    const d=DB.findById(id); if(!d)return;
    const option = d.quiz.options[optionIdx], correct = option.correct;
    const optsContainer = document.getElementById(`fc-options-${id}`);
    const feedback = document.getElementById(`fc-feedback-${id}`);
    if(!optsContainer || !feedback) return;
    
    optsContainer.innerHTML = d.quiz.options.map((o,i)=>{
      let cls='';if(i===optionIdx&&correct)cls='correct';else if(i===optionIdx&&!correct)cls='wrong';else if(o.correct)cls='correct';
      return`<div class="quiz-opt ${cls}" style="pointer-events:none;opacity:${cls?1:.4};margin-bottom:6px"><span class="ql">${String.fromCharCode(65+i)}</span>${o.text}${cls==='correct'?'<span style="margin-left:auto">✓</span>':cls==='wrong'?'<span style="margin-left:auto">✗</span>':''}</div>`;
    }).join('');
    
    feedback.innerHTML = `<strong style="display:block;margin-bottom:4px">${correct?'✓ Correcto':'✗ Incorrecto'}</strong>${option.feedback}`;
    feedback.style.display = 'block';
    feedback.style.background = correct?'rgba(52,211,153,.1)':'rgba(248,113,113,.1)';
    feedback.style.color = correct?'#6ee7b7':'#fca5a5';
    feedback.style.border = `1px solid ${correct?'rgba(52,211,153,.3)':'rgba(248,113,113,.3)'}`;
    
    if(correct) {
      AudioFX.quiz_correct();
      if(typeof Confetti !== 'undefined') Confetti.burst();
      feedback.innerHTML += `<div style="margin-top:8px;display:inline-block;padding:3px 10px;background:rgba(52,211,153,.15);border-radius:12px;color:#34d399;font-weight:700;font-size:11px">✓ Repaso al día</div>`;
    } else {
      AudioFX.wrong();
    }
  },

  /* ── Chat ── */
  async sendChat(){
    if(this._streaming)return;
    const all=DB.getAll(),{idx}=State.get(),d=all[idx],choice=State.getChoice(d.id);
    const input=document.getElementById('chat-input'),msgs=document.getElementById('chat-messages');
    if(!input||!msgs)return;const text=input.value.trim();if(!text)return;
    input.value='';input.style.height='auto';
    const u=document.createElement('div');u.className='chat-user';u.textContent=text;msgs.appendChild(u);msgs.scrollTop=msgs.scrollHeight;
    this._chatHistory.push({role:'user',content:text});
    const sysPrompt=choice?LLM.buildSystemPrompt(d,choice):`Eres un asesor histórico experto en ${d.category} del período ${d.year}. Responde de forma analítica y socrática en español.`;
    if(Config.hasKey()){
      this._streaming=true;
      const aiDiv=document.createElement('div');aiDiv.className='chat-ai';aiDiv.innerHTML='<span class="s-cursor">▋</span>';msgs.appendChild(aiDiv);msgs.scrollTop=msgs.scrollHeight;let acc='';
      await LLM.send(this._chatHistory,sysPrompt,
        chunk=>{acc+=chunk;aiDiv.innerHTML=parseMarkdown(acc)+'<span class="s-cursor">▋</span>';msgs.scrollTop=msgs.scrollHeight;},
        ()=>{aiDiv.innerHTML=parseMarkdown(acc);this._chatHistory.push({role:'assistant',content:acc});this._streaming=false;msgs.scrollTop=msgs.scrollHeight;},
        err=>{aiDiv.innerHTML=`<span style="color:#f87171;font-size:12px">⚠ ${err}</span>`;this._streaming=false;this._chatHistory.pop();}
      );
    } else {
      const responses=d.chat.responses,response=responses[this._chatIdx%responses.length];this._chatIdx++;
      const typing=document.createElement('div');typing.className='chat-ai';typing.innerHTML='<span style="display:flex;gap:4px;align-items:center;padding:2px 0"><span class="typing-dot"></span><span class="typing-dot" style="animation-delay:.2s"></span><span class="typing-dot" style="animation-delay:.4s"></span></span>';msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight;
      await new Promise(r=>setTimeout(r,700+Math.random()*500));typing.remove();
      const aiDiv=document.createElement('div');aiDiv.className='chat-ai';msgs.appendChild(aiDiv);msgs.scrollTop=msgs.scrollHeight;
      LLM.typewriter(response,aiDiv,()=>{this._chatHistory.push({role:'assistant',content:response});msgs.scrollTop=msgs.scrollHeight;});
    }
  },
  chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.sendChat();}},
  chatResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,96)+'px';},

  /* ── Settings ── */
  openSettings(){Render.settings();document.getElementById('settings-overlay').classList.add('open');},
  closeSettings(){document.getElementById('settings-overlay').classList.remove('open');},
  setProvider(key){const p=Config.getProviders()[key];if(!p)return;Config.save({provider:key,model:p.models[0].id});Render.settings();},
  toggleKeyVisibility(){const inp=document.getElementById('api-key-input');if(inp)inp.type=inp.type==='password'?'text':'password';},
  saveSettings(){const key=(document.getElementById('api-key-input')?.value||'').trim(),model=document.getElementById('model-select')?.value||'';Config.save({apiKey:key,model});this.closeSettings();showToast(key?'✓ API Key configurada. ¡Listo para debatir!':'Configuración guardada','🔑');if(this._modalOpen)Render.modal();},
  clearKey(){Config.save({apiKey:''});Render.settings();showToast('API Key eliminada','🗑️');if(this._modalOpen)Render.modal();},

  /* ── Profile ── */
  openProfile(){Render.profile();document.getElementById('profile-overlay').classList.add('open');},
  closeProfile(){document.getElementById('profile-overlay').classList.remove('open');},

  /* ── Modal ── */
  openModal(){
    const all=DB.getAll(),{idx}=State.get();
    if(!State.isDone(all[idx].id)){showToast('Primero elige una opción','🔒');return;}
    this._chatHistory=[];this._chatIdx=0;Render.modal();
    document.getElementById('side-modal').classList.add('open');document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';this._modalOpen=true;
    setTimeout(()=>document.getElementById('chat-input')?.focus(),550);
  },
  closeModal(){document.getElementById('side-modal').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';this._modalOpen=false;},

  /* ── Generator ── */
  openGenerator(){Render.generator();document.getElementById('generator-overlay').classList.add('open');},
  closeGenerator(){document.getElementById('generator-overlay').classList.remove('open');this._genTheme='';},
  selectTheme(t){this._genTheme=t;const inp=document.getElementById('gen-theme-input');if(inp)inp.value=t;document.querySelectorAll('.theme-chip').forEach(c=>c.classList.toggle('selected',c.textContent.trim()===t));AudioFX.click();},

  async generateDilemma(){
    const inp=document.getElementById('gen-theme-input'),theme=(inp?.value?.trim()||this._genTheme||'').trim();
    if(!theme){showToast('Escribe un tema primero','✏️');inp?.focus();return;}
    const btn=document.getElementById('gen-btn'),status=document.getElementById('gen-status');
    if(btn){btn.disabled=true;btn.innerHTML='<div class="gen-spinner"></div>Generando…';}
    if(status){status.style.display='block';status.innerHTML=`<p style="color:#34d399;font-size:12px;text-align:center">✦ Construyendo dilema sobre "<em>${theme}</em>"…</p>`;}
    AudioFX.select();
    if(Config.hasKey()){
      await LLM.generateDilemma(theme,partial=>{if(status)status.innerHTML=`<p style="color:#404060;font-size:11px;font-family:JetBrains Mono,monospace;max-height:60px;overflow:hidden">${partial.slice(-200)}</p>`;},
        dilemma=>{DB.addGenerated(dilemma);this.closeGenerator();const ni=DB.getAll().length-1;State.setIdx(ni);this._chatHistory=[];this._chatIdx=0;Render.dilemma();showToast(`✦ Dilema generado: "${dilemma.title}"`, '🤖');AudioFX.victory();},
        err=>{if(btn){btn.disabled=false;btn.innerHTML='Reintentar';}if(status)status.innerHTML=`<p style="color:#f87171;font-size:12px;text-align:center">⚠ ${err.startsWith('parse:')?'Error al parsear JSON. Reintenta.':err}</p>`;}
      );
    } else {
      const usedIds=new Set(DB._generated.map(d=>d.id));
      const available=LOCAL_TEMPLATES.filter(t=>!usedIds.has(t.id));
      const tpl=available.length>0?available[Math.floor(Math.random()*available.length)]:LOCAL_TEMPLATES[Math.floor(Math.random()*LOCAL_TEMPLATES.length)];
      await new Promise(r=>setTimeout(r,1400));
      const dilemma={...tpl,id:tpl.id+'-'+Date.now(),_generated:true};
      DB.addGenerated(dilemma);this.closeGenerator();const ni=DB.getAll().length-1;State.setIdx(ni);this._chatHistory=[];this._chatIdx=0;Render.dilemma();showToast(`✦ Dilema añadido: "${dilemma.title}"`, '📜');AudioFX.victory();
    }
  },

  shareVerdict(){
    const all=DB.getAll(),{idx,streak}=State.get(),d=all[idx],choice=State.getChoice(d.id);
    if(!choice){showToast('Primero elige una opción','⚠️');return;}
    const ok=choice===d.revelation.historicalChoice,pA=d.options.A.pct,pB=d.options.B.pct;
    const bar=n=>'█'.repeat(Math.round(n/10))+'░'.repeat(10-Math.round(n/10));
    const txt=[`🧠 Dopaminapp Mastery — Dilema del Día`,`━━━━━━━━━━━━━━━━`,`📌 ${d.category} · ${d.year}`,`${d.icon} ${d.title}`,``,`Mi veredicto: ${choice==='A'?'🔵':'🟡'} ${d.options[choice].label}`,ok?`✅ Acerté con la decisión histórica`:`❌ No acerté — fue "${d.revelation.choiceLabel}"`,``,`📊 La comunidad eligió:`,`🔵 A  ${bar(pA)} ${pA}%`,`🟡 B  ${bar(pB)} ${pB}%`,``,`🔥 Racha: ${streak.count} días | ⚡ ${State.getXP()} XP | 🔓 ${State.getUnlockedModels().length} modelos`,`dopaminapp.io`].join('\n');
    const copy=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);};
    (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>showToast('¡Veredicto copiado!','📋')).catch(()=>{copy();showToast('¡Veredicto copiado!','📋');});
  },

  _bindKeys(){
    document.addEventListener('keydown',e=>{
      if(e.target.matches('input,textarea,select'))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
      const all=DB.getAll(),{idx}=State.get(),d=all[idx],done=State.isDone(d.id);
      switch(e.key){
        case '1':if(!done)this.selectOption('A');break;
        case '2':if(!done)this.selectOption('B');break;
        case ' ':e.preventDefault();this._modalOpen?this.closeModal():this.openModal();break;
        case 'Escape':
          if(document.getElementById('settings-overlay').classList.contains('open'))this.closeSettings();
          else if(document.getElementById('profile-overlay').classList.contains('open'))this.closeProfile();
          else if(document.getElementById('generator-overlay').classList.contains('open'))this.closeGenerator();
          else this.closeModal();break;
        case 'ArrowRight':this.navigate(1);break;
        case 'ArrowLeft':this.navigate(-1);break;
      }
    });
  },

  _bindMobileViewport(){
    if(!window.visualViewport)return;
    const handle=()=>{const modal=document.getElementById('side-modal');if(!modal?.classList.contains('open'))return;modal.style.height=window.visualViewport.height+'px';modal.style.top=window.visualViewport.offsetTop+'px';const msgs=document.getElementById('chat-messages');if(msgs)setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);};
    window.visualViewport.addEventListener('resize',handle);window.visualViewport.addEventListener('scroll',handle);
  },
};

document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
