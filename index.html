<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function stripHtml(s){ return (s||'').replace(/<[^>]+>/g,''); }

function parseMarkdown(text){
  let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines = h.split('\n');
  let out=[],inList=false;
  for(const ln of lines){
    if(/^[-•]\s/.test(ln)){ if(!inList){out.push('<ul>');inList=true;} out.push(`<li>${ln.slice(2)}</li>`); }
    else{ if(inList){out.push('</ul>');inList=false;} out.push(ln); }
  }
  if(inList) out.push('</ul>');
  return out.join('\n').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');
}

function showToast(text,icon='✓',ms=2800){
  const el=document.getElementById('toast-inner');
  document.getElementById('toast-icon').textContent=icon;
  document.getElementById('toast-text').textContent=text;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>el.classList.remove('show'),ms);
}


/* ═══════════════════════════════════════════════════════════
   MODULE: AUDIO FX  (Web Audio API)
═══════════════════════════════════════════════════════════ */
const AudioFX = (() => {
  let _ctx = null;
  function ctx(){
    if(!_ctx) try{ _ctx = new(window.AudioContext||window.webkitAudioContext)(); }catch(_){}
    return _ctx;
  }

  function click(){
    const c=ctx(); if(!c) return;
    try{
      const osc=c.createOscillator(), g=c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.frequency.setValueAtTime(900,c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220,c.currentTime+.06);
      g.gain.setValueAtTime(.12,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);
      osc.start(); osc.stop(c.currentTime+.09);
    }catch(_){}
  }

  function select(){
    const c=ctx(); if(!c) return;
    try{
      const osc=c.createOscillator(), g=c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type='sine'; osc.frequency.setValueAtTime(520,c.currentTime);
      g.gain.setValueAtTime(.05,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);
      osc.start(); osc.stop(c.currentTime+.2);
    }catch(_){}
  }

  function victory(){
    const c=ctx(); if(!c) return;
    // Major chord: root + major-third + fifth + octave
    [[440,0],[554,.08],[659,.16],[880,.26]].forEach(([freq,delay])=>{
      try{
        const osc=c.createOscillator(), g=c.createGain();
        osc.connect(g); g.connect(c.destination);
        osc.type='sine'; osc.frequency.setValueAtTime(freq,c.currentTime+delay);
        g.gain.setValueAtTime(0,c.currentTime+delay);
        g.gain.linearRampToValueAtTime(.07,c.currentTime+delay+.05);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+.9);
        osc.start(c.currentTime+delay); osc.stop(c.currentTime+delay+.9);
      }catch(_){}
    });
  }

  function wrong(){
    const c=ctx(); if(!c) return;
    try{
      const osc=c.createOscillator(), g=c.createGain();
      osc.connect(g); g.connect(c.destination);
      osc.type='sawtooth'; osc.frequency.setValueAtTime(200,c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120,c.currentTime+.18);
      g.gain.setValueAtTime(.06,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);
      osc.start(); osc.stop(c.currentTime+.22);
    }catch(_){}
  }

  return { click, select, victory, wrong };
})();


/* ═══════════════════════════════════════════════════════════
   MODULE: CONFETTI  (Canvas)
═══════════════════════════════════════════════════════════ */
const Confetti = (() => {
  let animId=null, particles=[];
  const COLORS=['#4f8ef7','#a78bfa','#34d399','#f5a623','#f0f0ff','#f87171'];

  function burst(){
    const canvas=document.getElementById('confetti-canvas');
    if(!canvas) return;
    canvas.style.display='block';
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    const ctx2d=canvas.getContext('2d');
    if(animId){ cancelAnimationFrame(animId); animId=null; }

    particles = Array.from({length:70},()=>({
      x: window.innerWidth*(.2+Math.random()*.6),
      y: -10 - Math.random()*40,
      vx: (Math.random()-.5)*5,
      vy: Math.random()*3+1.5,
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
      size: Math.random()*7+3,
      rotation: Math.random()*360,
      rotV: (Math.random()-.5)*10,
      shape: Math.random()>.5?'rect':'circle',
    }));

    function frame(){
      ctx2d.clearRect(0,0,canvas.width,canvas.height);
      let alive=false;
      for(const p of particles){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.07; p.rotation+=p.rotV;
        if(p.y < canvas.height+20){
          alive=true;
          const alpha=Math.max(0,1-p.y/canvas.height*1.1);
          ctx2d.save();
          ctx2d.translate(p.x,p.y);
          ctx2d.rotate(p.rotation*Math.PI/180);
          ctx2d.globalAlpha=alpha;
          ctx2d.fillStyle=p.color;
          if(p.shape==='circle'){
            ctx2d.beginPath(); ctx2d.arc(0,0,p.size/2,0,Math.PI*2); ctx2d.fill();
          } else {
            ctx2d.fillRect(-p.size/2,-p.size*.3,p.size,p.size*.6);
          }
          ctx2d.restore();
        }
      }
      if(alive) animId=requestAnimationFrame(frame);
      else { canvas.style.display='none'; }
    }
    animId=requestAnimationFrame(frame);
    setTimeout(()=>{if(animId){cancelAnimationFrame(animId);animId=null;canvas.style.display='none';}},4000);
  }

  return { burst };
})();

  async _readStream(response,onChunk,onDone,onError,parseChunk){
    try{
      const reader=response.body.getReader(), dec=new TextDecoder();
      let buf='';
      while(true){
        const {done,value}=await reader.read();
        if(done){onDone();break;}
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data: ')) continue;
          const data=line.slice(6).trim();
          if(data==='[DONE]'){onDone();return;}
          if(!data) continue;
          try{ const chunk=parseChunk(JSON.parse(data)); if(chunk) onChunk(chunk); }catch(_){}
        }
      }
    }catch(e){ onError(e.message); }
  },

  async streamGemini(cfg,messages,systemPrompt,onChunk,onDone,onError){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:streamGenerateContent?alt=sse&key=${cfg.apiKey}`;
    const contents=messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
    let res;
    try{ res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:systemPrompt}]},contents,generationConfig:{temperature:.85,maxOutputTokens:700}})}); }
    catch(e){ onError('Error de red: '+e.message); return; }
    if(!res.ok){ const err=await res.json().catch(()=>({error:{message:'Error '+res.status}})); onError(err.error?.message||'Error '+res.status); return; }
    await this._readStream(res,onChunk,onDone,onError,j=>j.candidates?.[0]?.content?.parts?.[0]?.text);
  },

  async streamOpenAI(cfg,messages,systemPrompt,onChunk,onDone,onError){
    let res;
    try{ res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},body:JSON.stringify({model:cfg.model,stream:true,messages:[{role:'system',content:systemPrompt},...messages],max_tokens:700,temperature:.85})}); }
    catch(e){ onError('Error de red: '+e.message); return; }
    if(!res.ok){ const err=await res.json().catch(()=>({error:{message:'Error '+res.status}})); onError(err.error?.message||'Error '+res.status); return; }
    await this._readStream(res,onChunk,onDone,onError,j=>j.choices?.[0]?.delta?.content);
  },

  async send(messages,systemPrompt,onChunk,onDone,onError){
    const cfg=Config.get();
    if(cfg.provider==='openai') await this.streamOpenAI(cfg,messages,systemPrompt,onChunk,onDone,onError);
    else await this.streamGemini(cfg,messages,systemPrompt,onChunk,onDone,onError);
  },

  async generateDilemma(theme,onProgress,onDone,onError){
    if(!Config.hasKey()){ onError('no-key'); return; }
    const cfg=Config.get();
    const prompt=this.buildGeneratorPrompt(theme);
    let accumulated='';
    await this.send(
      [{role:'user',content:prompt}],
      'Eres un experto en historia, economía, filosofía política y geopolítica. Genera contenido educativo preciso, estructurado y en español.',
      chunk=>{ accumulated+=chunk; onProgress(accumulated); },
      ()=>{
        try{
          let clean=accumulated.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
          const s=clean.indexOf('{'), e=clean.lastIndexOf('}');
          if(s===-1||e===-1) throw new Error('JSON inválido');
          const d=JSON.parse(clean.slice(s,e+1));
          d.id=d.id||'ai-generated-'+Date.now();
          d._generated=true;
          onDone(d);
        }catch(err){ onError('parse: '+err.message); }
      },
      onError
    );
  },

  typewriter(text,element,onDone,speed=18){
    const chars=[...text]; let i=0;
    function tick(){ if(i<chars.length){ element.textContent+=chars[i++]; setTimeout(tick,speed+Math.random()*12); } else { element.innerHTML=parseMarkdown(text); if(onDone) onDone(); } }
    tick();
  },
};

    options:{A:{label:'Recetas del FMI',desc:'Austeridad fiscal, tasas altas, liberalización de mercados a cambio del rescate. Dolor a corto plazo, estabilidad a largo.',pct:44},B:{label:'Controles de capital',desc:'Rechazar condiciones del FMI. Imponer controles de capital para detener la fuga. Proteger la economía doméstica.',pct:56}},
    revelation:{historicalChoice:'B',choiceLabel:'Controles de capital',actor:'Mahathir Mohamad (Malasia)',text:'Tailandia, Indonesia y Corea aceptaron el FMI — sus economías sufrieron recesiones devastadoras con 40% de caída del PIB en algunos sectores. <strong style="color:#34d399">Malasia rechazó al FMI</strong>, impuso controles de capital y fijó el tipo de cambio. Su recuperación fue más rápida. El debate sobre las "condicionalidades" del FMI reconfiguró la economía del desarrollo global.',concept:'Trilemma de Mundell & Contagio',conceptAuthors:'Joseph Stiglitz · Globalization and its Discontents, 2002',conceptExp:'La crisis asiática demostró que la liberalización financiera sin supervisión prudencial crea vulnerabilidades sistémicas. El "contagio financiero" — donde la crisis de un país se propaga a otros sin conexión fundamental — invalidó los modelos de crisis estándar del FMI. Stiglitz ganó el Nobel (2001) en parte por predecir estos fallos.',metrics:[{value:'+3%',label:'PIB Malasia 1999',col:'#34d399'},{value:'-13%',label:'PIB Indonesia 1998',col:'#f87171'}]},
    article:{title:'La Crisis Asiática: Cuando el FMI Erró',readTime:'3 min',sections:[{h:'El milagro asiático y su fragilidad',p:'Los "Tigres Asiáticos" habían crecido al 8-10% anual durante dos décadas. Pero bajo el crecimiento se acumularon desequilibrios: endeudamiento en dólares, burbujas inmobiliarias y sistemas bancarios opacos. La liberalización financiera de los 90, impulsada por el FMI, expuso estas vulnerabilidades.',hl:false},{h:'El debate Stiglitz vs FMI',p:'Joseph Stiglitz, entonces economista jefe del Banco Mundial, criticó públicamente las recetas del FMI: subir tasas en medio de una recesión agravaba la caída. La austeridad reducía la demanda exactamente cuando era necesario estimularla. El FMI respondió que sin credibilidad fiscal, ningún rescate funcionaría. El debate sigue sin resolver.',hl:true},{h:'El experimento malayo',p:'Mahathir impuso controles de capital en septiembre de 1998, fijó el tipo de cambio a 3.8 ringgit/dólar e ignoró al FMI. En 1999, Malasia creció 3%. Los defensores del FMI argumentaron que la recuperación se debía a la mejora global; los críticos señalaron que Malasia evitó la devastación social que sufrieron Tailandia e Indonesia.',hl:false},{h:'Legado: el FMI reformado',p:'La crisis asiática forzó una reforma profunda del FMI. Las "condicionalidades" se suavizaron. La idea de que los mercados de capitales siempre se autoequilibran quedó desacreditada. China observó la crisis y concluyó que los controles de capital no son un signo de atraso sino de prudencia soberana — lección que aplica hasta hoy.',hl:false}],timeline:[{date:'Jul 1997',text:'Tailandia devalúa el baht. Crisis se propaga a toda Asia.',col:'#f87171'},{date:'Ago 1997',text:'FMI anuncia paquete de $117B con condicionalidades.',col:'#f5a623'},{date:'Sep 1998',text:'Malasia impone controles de capital. Rechaza al FMI.',col:'#f5a623'},{date:'1999',text:'Malasia crece 3%. Tailandia e Indonesia en recesión profunda.',col:'#34d399'}]},
    chat:{starter:'El FMI exigía austeridad para restaurar confianza. Malasia impuso controles y se recuperó más rápido. ¿Qué dice esto sobre la diferencia entre "confianza del mercado" y bienestar económico real?',responses:['El FMI operaba con un modelo de crisis de balanza de pagos clásica: el problema era falta de credibilidad fiscal. Pero la crisis asiática era fundamentalmente diferente: los gobiernos tenían superávit fiscal, el problema era deuda privada en dólares y pánico de mercado. Aplicar el manual equivocado agravó la crisis. ¿Cómo distingues cuándo el diagnóstico correcto es más importante que la medicina?','Stiglitz argumentó que las condicionalidades del FMI en Asia equivalían a recetar austeridad a un paciente que sufre shock hemorrágico. La urgencia requería estimular, no restringir. La respuesta del FMI fue que sin disciplina fiscal, la confianza del mercado no regresaría. Este debate — estímulo vs austeridad en crisis — continúa en Europa en 2010, en Argentina en 2001, en cada crisis de deuda soberana.','La gran lección que China extrajo de la crisis asiática fue clara: nunca liberalizar completamente la cuenta de capital. Hasta hoy, China mantiene controles sobre los flujos de capitales — lo cual le da autonomía monetaria pero limita la internacionalización del yuan. ¿Es la soberanía monetaria más valiosa que la integración financiera global?','El "contagio" financiero demostró que los mercados no son racionales en el sentido eficiente: pánico en Tailandia llevó a ventas masivas en Corea del Sur sin razón fundamental. Esto invalidó la hipótesis de mercados eficientes en situaciones de estrés. ¿Cómo diseñas un sistema financiero que sea resiliente al pánico irracional sin suprimir los mercados?']}

    revelation:{historicalChoice:'B',choiceLabel:'Terapia de Shock',actor:'Paul Volcker',text:'Volcker escaló las tasas hasta casi el <strong style="color:#e8e8f8">20%</strong>. La economía entró en recesión, el desempleo llegó al 10.8%. Recibió amenazas de muerte y fue quemado en efigie. Para 1983 la inflación había caído al <strong style="color:#34d399">3.2%</strong> y el crecimiento regresó con fuerza récord.',concept:'Inconsistencia Temporal',conceptAuthors:'Kydland & Prescott · Nobel 2004',conceptExp:'Los policy makers tienen incentivos para <em>prometer</em> baja inflación y luego <em>incumplir</em> esa promesa para estimular el empleo. Resultado: nadie cree sus promesas y la inflación se cronifica. La única salida es un compromiso creíble — independencia del banco central o un shock tan doloroso que restaure la credibilidad por décadas.',metrics:[{value:'3.2%',label:'Inflación 1983',col:'#34d399'},{value:'+7.2%',label:'Crecimiento 1984',col:'#4f8ef7'}]},
    article:{title:'La Crisis de Stagflación de 1979',readTime:'3 min',sections:[{h:'El contexto: una economía en llamas',p:'En 1979, EE.UU. enfrentaba su peor crisis económica desde la Gran Depresión. La inflación superaba el 13% anual, alimentada por dos shocks petroleros (1973 y 1979), política monetaria laxa y gasto deficitario acumulado de Vietnam.',hl:false},{h:'Paul Volcker y el dilema imposible',p:'Carter nombró a Volcker en agosto de 1979. Volcker sabía que solo existía una solución: destruir la credibilidad de la inflación alta aunque el precio fuera una recesión brutal. En octubre de 1979 cambió el objetivo: la Fed controlaría la oferta monetaria. Las tasas escalaron del 10% al ~20% en 1981.',hl:true},{h:'El concepto: Inconsistencia Temporal',p:'Kydland y Prescott (Nobel 2004) formalizaron el dilema: los gobiernos tienen incentivos para prometer baja inflación y luego incumplir. La única salida es un mecanismo de compromiso creíble — independencia del banco central o reglas rígidas.',hl:false},{h:'El legado moderno',p:'El "Volcker Shock" estableció el paradigma de bancos centrales independientes que rige hasta hoy. Jerome Powell citó explícitamente a Volcker en sus discursos de Jackson Hole durante el ciclo de subidas 2022-2023.',hl:false}],timeline:[{date:'Ago 1979',text:'Volcker nombrado presidente de la Fed por Carter.',col:'#f5a623'},{date:'Oct 1979',text:'Cambio de objetivo monetarista. Tasas comienzan a escalar.',col:'#f5a623'},{date:'1981–82',text:'Recesión intensa. Desempleo llega al 10.8%.',col:'#f87171'},{date:'1983–84',text:'Inflación cae al 3.2%. Expansión récord. Victoria de Volcker.',col:'#34d399'}]},
    chat:{starter:'¿Tu razonamiento priorizó el bienestar inmediato o la estabilidad estructural a largo plazo? Recuerda que en 1979 nadie garantizaba que el shock funcionaría.',responses:['La Inconsistencia Temporal es el problema central: cualquier promesa de moderación habría sido interpretada como señal de que la Fed cedería bajo presión política. La única forma de restaurar credibilidad era el costo que nadie quería pagar. ¿Crees que habría existido alguna alternativa que no requiriera este sacrificio?','Nixon intentó controles de precios en 1971-74 — exactamente lo que propone la Opción A. Funcionaron temporalmente, pero cuando se retiraron, la inflación explotó con más fuerza. ¿Cuál es la diferencia entre suprimir un síntoma y tratar la causa?','El ciclo de subidas de la Fed en 2022-2023 siguió exactamente el manual Volcker. Powell sacrificó popularidad para mantener credibilidad. ¿Qué dice esto sobre la naturaleza del liderazgo institucional versus el liderazgo político?','La inflación "desanclada" es cuando las expectativas divergen de la meta del banco central. Cuando trabajadores piden aumentos anticipando inflación futura y empresas suben precios preventivamente, el ciclo se retroalimenta. Volcker tuvo que romper esa dinámica con violencia monetaria. ¿Existe un modo más humano de hacer lo mismo?']}

    chat:{starter:'¿Tu decisión refleja cómo crees que funciona el poder real, o cómo crees que debería funcionar? Hay una diferencia enorme entre ambas perspectivas.',responses:['El León y el Zorro son complementarios: el León necesita la astucia del Zorro para no caer en trampas; el Zorro necesita la fuerza del León para no ser devorado. Los gobernantes que solo usan uno de los dos modelos fracasan. ¿Cuál de los dos crees que es más escaso en los líderes contemporáneos?','Platón quería gobernantes-filósofos guiados por la Justicia ideal. Maquiavelo quería gobernantes eficaces guiados por la necesidad real. 2500 años después, las democracias intentan un híbrido: líderes moralmente impecables Y políticamente efectivos. ¿Es ese híbrido estable o una contradicción estructural?','La Virtù de Maquiavelo no tiene nada que ver con la virtud cristiana. Es adaptabilidad, decisión y capacidad de actuar en el momento correcto. En términos modernos: capacidad ejecutiva + inteligencia situacional + disposición para tomar decisiones impopulares necesarias.','Kissinger es considerado el maquiavélico más influyente del siglo XX. Defendió a regímenes autoritarios si servían a los intereses estratégicos de EE.UU. ¿Dónde está la línea entre el pragmatismo político y la complicidad moral?']}

    article:{title:'Trece Días que Cambiaron la Historia',readTime:'3 min',sections:[{h:'El descubrimiento',p:'El 14 de octubre de 1962, un U-2 fotografió sitios de misiles soviéticos en Cuba. El análisis confirmó misiles R-12 con alcance para alcanzar Washington D.C. Kennedy fue informado el 16 y convocó al ExComm, un grupo secreto de 14 asesores.',hl:false},{h:'El ExComm dividido',p:'Los "halcones" — el general LeMay y el director de la CIA McCone — presionaban por ataque aéreo masivo. Lo que no sabían: los soviéticos tenían 100 armas tácticas nucleares operacionales en Cuba, listas para usar en caso de invasión.',hl:true},{h:'La teoría del juego: Brinksmanship',p:'Schelling formalizó el Brinksmanship: llevar al adversario al borde del abismo para forzar concesiones. El bloqueo era Brinksmanship clásico: Khrushchev debía elegir entre escalar (riesgo nuclear) o retroceder (pérdida de reputación).',hl:false},{h:'El hombre que salvó el mundo',p:'El 27 de octubre, el submarino soviético B-59 perdió comunicación con Moscú. El capitán Savitsky ordenó armar el torpedo nuclear. Solo el oficial Vasili Arkhipov vetó el lanzamiento. Un desconocido evitó la Tercera Guerra Mundial.',hl:false}],timeline:[{date:'14 Oct',text:'U-2 fotografía sitios de misiles soviéticos en Cuba.',col:'#f87171'},{date:'16 Oct',text:'Kennedy convoca el ExComm en secreto.',col:'#f5a623'},{date:'22 Oct',text:'Kennedy anuncia el bloqueo naval al mundo.',col:'#f5a623'},{date:'27 Oct',text:'"Sábado Negro": U-2 derribado. Arkhipov veta torpedo nuclear.',col:'#f87171'},{date:'28 Oct',text:'Khrushchev retira los misiles. Crisis resuelta.',col:'#34d399'}]},
    chat:{starter:'El ExComm estuvo dividido por días. ¿Qué argumento concreto te habría convencido de cambiar tu decisión? ¿Qué información considerarías decisiva?',responses:['Lo que los "halcones" del ExComm no sabían: los soviéticos tenían misiles tácticos Luna con ojivas nucleares y órdenes de usarlos si Cuba era invadida. Un ataque aéreo habría desencadenado una respuesta nuclear táctica, lo que habría obligado a EE.UU. a responder, lo que habría obligado a la URSS a responder en Berlín... ¿Ves cómo la "solución quirúrgica" ignoraba la complejidad real del sistema?','El acuerdo final incluyó una cláusula secreta no revelada por décadas: EE.UU. retiró sus misiles Jupiter de Turquía en 6 meses. La "victoria" fue en realidad un intercambio de misiles disfrazado de firmeza. ¿Cuál es la diferencia entre diplomacia real y teatro político?','El "hotline" Moscú-Washington se instaló directamente como resultado de la crisis del 62. La lección: las guerras nucleares no comienzan por agresión deliberada, sino por malentendidos en situaciones de alta presión. ¿Qué nos dice esto sobre los sistemas de comunicación en crisis geopolíticas actuales?','Vasili Arkhipov no comprendía en ese momento que estaba tomando la decisión más importante de la historia humana. Actuaba por protocolo y dudas sobre la situación real. La paz más importante del siglo XX dependió de la sensatez burocrática de un oficial desconocido. ¿Qué nos revela esto sobre cómo funciona realmente el poder en los momentos críticos?']}

/* ═══════════════════════════════════════════════════════════
   MODULE: STATE MANAGEMENT
═══════════════════════════════════════════════════════════ */
const State = (() => {
  const KEY='dopaminapp_v4_state';
  let s={idx:0,completed:{},streak:{count:0,last:null}};
  function _today(){ return new Date().toISOString().slice(0,10); }
  function load(){
    try{ const r=localStorage.getItem(KEY); if(r) s={...s,...JSON.parse(r)}; }catch(_){}
    if(s.streak.last){
      const diff=(new Date(_today())-new Date(s.streak.last))/86400000;
      if(diff>1){ s.streak.count=0; s.streak.last=null; _save(); }
    }
    return s;
  }
  function _save(){ try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(_){} }
  function complete(id,choice){
    if(s.completed[id]) return;
    s.completed[id]={choice,ts:Date.now()};
    const today=_today();
    if(s.streak.last!==today){ s.streak.count++; s.streak.last=today; }
    _save();
  }
  function isDone(id){ return !!s.completed[id]; }
  function getChoice(id){ return s.completed[id]?.choice||null; }
  function get(){ return s; }
  function setIdx(i){ s.idx=i; _save(); }
  function reset(){ s={idx:0,completed:{},streak:{count:0,last:null}}; _save(); }
  return { load,complete,isDone,getChoice,get,setIdx,reset };
})();

  compute(){
    const all=DB.getAll();
    const completed=all.filter(d=>State.isDone(d.id));
    if(completed.length===0) return null;

    let boldCount=0, accurateCount=0;
    const domainData={};
    for(const dom of this.DOMAINS) domainData[dom.key]={done:0,accurate:0,total:0};

    for(const d of all){
      // Count total in domain
      for(const dom of this.DOMAINS){
        if(dom.ids.includes(d.id)){ domainData[dom.key].total++; }
      }
      if(!State.isDone(d.id)) continue;
      const choice=State.getChoice(d.id);
      if(choice==='B') boldCount++;
      if(choice===d.revelation.historicalChoice) accurateCount++;
      for(const dom of this.DOMAINS){
        if(dom.ids.includes(d.id)){
          domainData[dom.key].done++;
          if(choice===d.revelation.historicalChoice) domainData[dom.key].accurate++;
        }
      }
    }

    const total=completed.length;
    const boldness=Math.round((boldCount/total)*100);
    const accuracy=Math.round((accurateCount/total)*100);
    const archetype=this.ARCHETYPES.find(a=>a.cond(boldness,accuracy))||this.ARCHETYPES[4];

    // Domain scores (0-100)
    const domainScores={};
    for(const dom of this.DOMAINS){
      const d=domainData[dom.key];
      domainScores[dom.key]=d.done===0?null:Math.round((d.accurate/d.done)*100);
    }

    return {total,boldness,accuracy,archetype,domainScores,domainData};
  },
};

              ${isHist?`<span class="label-xs" style="background:#34d39912;border:1px solid #34d39928;color:#34d399;padding:2px 7px;border-radius:999px">✓ Histórico</span>`:''}
            </div>

          </div>

          <div class="pct-track"><div class="pct-fill" id="pct-${opt}-bar" data-target="${pct}" style="background:linear-gradient(90deg,${col},${col}88)"></div></div>
        </div>`;
      }).join('')}
    </div>`;
  },

  _animateBars(d){
    ['A','B'].forEach(opt=>{
      const bar=document.getElementById(`pct-${opt}-bar`),num=document.getElementById(`pct-${opt}-num`);
      if(!bar||!num) return;
      const target=parseInt(bar.dataset.target);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width=target+'%';}));
      let start=null;
      function step(ts){
        if(!start) start=ts;
        const p=Math.min((ts-start)/1300,1),e=1-Math.pow(1-p,4);
        num.textContent=Math.round(e*target)+'%';
        if(p<1) requestAnimationFrame(step); else num.textContent=target+'%';
      }
      setTimeout(()=>requestAnimationFrame(step),80);
    });
  },

      <div class="cmodal-body">
        <!-- Archetype Card -->
        <div style="background:${archetype.color}0c;border:1px solid ${archetype.color}28;border-radius:16px;padding:20px;margin-bottom:20px;text-align:center">
          <div style="font-size:44px;margin-bottom:10px">${archetype.icon}</div>
          <p style="color:${archetype.color};font-weight:700;font-size:18px;margin-bottom:6px">${archetype.name}</p>
          <p style="color:#5a5a7a;font-size:13px;line-height:1.6">${archetype.desc}</p>
        </div>

        <!-- Metrics Grid -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
          <div style="background:#0c0c18;border:1px solid #1e1e30;border-radius:12px;padding:14px 16px;text-align:center">
            <p class="mono-val" style="font-size:32px;color:#34d399;line-height:1">${accuracy}%</p>
            <p class="label-xs" style="color:#2a2a42;margin-top:8px">Acierto Histórico</p>
          </div>
          <div style="background:#0c0c18;border:1px solid #1e1e30;border-radius:12px;padding:14px 16px;text-align:center">
            <p class="mono-val" style="font-size:32px;color:#a78bfa;line-height:1">${boldness}%</p>
            <p class="label-xs" style="color:#2a2a42;margin-top:8px">Índice de Audacia</p>
          </div>
          <div style="background:#0c0c18;border:1px solid #1e1e30;border-radius:12px;padding:14px 16px;text-align:center">
            <p class="mono-val" style="font-size:32px;color:#4f8ef7;line-height:1">${total}</p>
            <p class="label-xs" style="color:#2a2a42;margin-top:8px">Dilemas Completados</p>
          </div>
          <div style="background:#0c0c18;border:1px solid #1e1e30;border-radius:12px;padding:14px 16px;text-align:center">
            <p class="mono-val" style="font-size:32px;color:#f5a623;line-height:1">${DB.getAll().length}</p>
            <p class="label-xs" style="color:#2a2a42;margin-top:8px">Dilemas Disponibles</p>
          </div>
        </div>

        <!-- Domain Breakdown -->
        <p class="label-xs" style="color:#252540;margin-bottom:14px">Desempeño por Área</p>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${Profile.DOMAINS.map(dom=>{
            const dd=domainData[dom.key];
            const pct=dd.done>0?Math.round((dd.accurate/dd.done)*100):null;
            return`<div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:13px">${dom.icon}</span>
                  <span style="color:#c0c0e0;font-size:13px;font-weight:500">${dom.label}</span>
                  ${dd.done>0?`<span class="label-xs" style="color:#252540">${dd.done}/${dd.total} completados</span>`:`<span class="label-xs" style="color:#1e1e30">sin datos</span>`}
                </div>
                <span class="mono-val" style="font-size:14px;color:${dom.col}" id="dom-pct-${dom.key}">${pct!==null?'0%':'—'}</span>
              </div>
              <div class="domain-bar-track">
                ${pct!==null?`<div class="domain-bar-fill" id="dom-bar-${dom.key}" data-target="${pct}" style="background:${dom.col}"></div>`:''}
              </div>
            </div>`;
          }).join('')}
        </div>

        <!-- Tendency Analysis -->
        <div style="margin-top:20px;background:#0c0c18;border:1px solid #1e1e30;border-radius:12px;padding:14px 16px">
          <p class="label-xs" style="color:#252540;margin-bottom:10px">Análisis de Tendencia</p>
          <div style="display:flex;gap:8px;align-items:center">
            <span style="font-size:12px;color:#404060">Cauteloso</span>
            <div style="flex:1;height:4px;background:#1e1e30;border-radius:2px;position:relative">
              <div style="position:absolute;left:0;top:0;height:100%;border-radius:2px;background:linear-gradient(90deg,#34d399,#4f8ef7);width:0%" id="boldness-bar" data-target="${boldness}"></div>
            </div>
            <span style="font-size:12px;color:#404060">Audaz</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:8px">
            <span style="font-size:11px;color:#252540">Baja Audacia</span>
            <span style="font-size:11px;color:#4f8ef7;font-weight:600">${boldness < 35 ? 'Moderado' : boldness < 65 ? 'Equilibrado' : 'Audaz'}</span>
            <span style="font-size:11px;color:#252540">Alta Audacia</span>
          </div>
        </div>
      </div>`;

    // Animate bars after render
    setTimeout(()=>{
      Profile.DOMAINS.forEach(dom=>{
        const bar=document.getElementById(`dom-bar-${dom.key}`);
        const num=document.getElementById(`dom-pct-${dom.key}`);
        if(!bar||!num) return;
        const target=parseInt(bar.dataset.target||0);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.width=target+'%'; }));
        let start=null;
        function step(ts){ if(!start) start=ts; const p=Math.min((ts-start)/1000,1),e=1-Math.pow(1-p,3); num.textContent=Math.round(e*target)+'%'; if(p<1) requestAnimationFrame(step); else num.textContent=target+'%'; }
        requestAnimationFrame(step);
      });
      const bb=document.getElementById('boldness-bar');
      if(bb){ const t=parseInt(bb.dataset.target||0); requestAnimationFrame(()=>requestAnimationFrame(()=>{ bb.style.width=t+'%'; })); }
    },100);
  },

  generator(){
    const hasKey=Config.hasKey();
    const THEMES=['Churchill 1940','Plan Marshall','Crisis Asiática 1997','Crisis de Suez 1956','La Gran Depresión 1929','Hiroshima & Nagasaki','Revolución Francesa 1789','La Burbuja de los Tulipanes 1637'];
    document.getElementById('generator-content').innerHTML=`
      <div class="cmodal-header">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <h3 style="color:#f0f0ff;font-weight:700;font-size:17px">✦ Generar Dilema con IA</h3>
            <p style="color:#404060;font-size:12px;margin-top:2px">${hasKey?'Powered by '+Config.get().model:'Generador local · Agrega API Key para IA real'}</p>
          </div>
          <button onclick="App.closeGenerator()" style="width:28px;height:28px;border-radius:8px;background:#141420;border:1px solid #252535;color:#404060;cursor:pointer;display:flex;align-items:center;justify-content:center" onmouseover="this.style.color='#d0d0f0'" onmouseout="this.style.color='#404060'">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="cmodal-body">
        <p class="label-xs" style="color:#2a2a40;margin-bottom:10px">Tema o período histórico</p>
        <input id="gen-theme-input" class="settings-input" placeholder="Ej: La Revolución Industrial, La caída de Roma, Crisis del petróleo 1973…" style="margin-bottom:14px">
        <p class="label-xs" style="color:#1e1e30;margin-bottom:10px">Temas sugeridos</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">
          ${THEMES.map(t=>`<button class="theme-chip" onclick="App.selectTheme('${t}')">${t}</button>`).join('')}
        </div>
        <button id="gen-btn" onclick="App.generateDilemma()" style="width:100%;padding:13px;border-radius:11px;background:linear-gradient(135deg,#34d399,#059669);border:none;color:white;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
          ${hasKey?'Generar con IA':'Generar Dilema'}
        </button>
        <div id="gen-status" style="margin-top:14px;display:none"></div>
        ${!hasKey?`<p style="color:#2a2a40;font-size:11.5px;margin-top:12px;text-align:center;line-height:1.5">💡 <button onclick="App.closeGenerator();App.openSettings()" style="background:none;border:none;color:#4f8ef7;cursor:pointer;text-decoration:underline;font-size:11.5px">Agrega tu API Key</button> para dilemas generados en tiempo real con IA</p>`:''}
      </div>`;
  },
};


/* ═══════════════════════════════════════════════════════════
   MODULE: APP CONTROLLER
═══════════════════════════════════════════════════════════ */
const App = {
  _chatIdx:    0,
  _modalOpen:  false,
  _chatHistory:[],
  _streaming:  false,
  _genTheme:   '',

  init(){
    State.load();
    Config.load();
    Render.dilemma();
    this._bindKeys();
    this._bindMobileViewport();
  },

  goTo(i){
    const all=DB.getAll();
    if(i<0||i>=all.length||i===State.get().idx) return;
    State.setIdx(i); this._chatIdx=0; this._chatHistory=[];
    Render.dilemma();
    AudioFX.click();
  },

  navigate(dir){
    const all=DB.getAll(), next=State.get().idx+dir;
    if(next>=0&&next<all.length) this.goTo(next);
  },

  selectOption(opt){
    const all=DB.getAll(), {idx}=State.get(), d=all[idx];
    if(State.isDone(d.id)) return;
    AudioFX.select();
    State.complete(d.id,opt);
    const optArea=document.getElementById('options-area'), revArea=document.getElementById('revelation-area');
    if(!optArea||!revArea) return;
    optArea.style.transition='opacity .22s'; optArea.style.opacity='0';
    setTimeout(()=>{
      optArea.innerHTML=Render._optionsDone(d,opt); optArea.style.opacity='1';
      Render._animateBars(d);
      revArea.innerHTML=Render._revelation(d,opt);
      Render.header();
      const ok=opt===d.revelation.historicalChoice;
      if(ok){ AudioFX.victory(); Confetti.burst(); document.getElementById('dilemma-card')?.classList.add('victory-pulse'); }
      else   { AudioFX.wrong(); }
      showToast(ok?`✓ Acertaste con la decisión de ${d.revelation.actor}!`:'📖 Mira la revelación histórica', ok?'🎯':'📖');
    },230);
  },

  openModal(){
    const all=DB.getAll(), {idx}=State.get();
    if(!State.isDone(all[idx].id)){ showToast('Primero elige una opción','🔒'); return; }
    this._chatHistory=[]; this._chatIdx=0;
    Render.modal();
    document.getElementById('side-modal').classList.add('open');
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow='hidden'; this._modalOpen=true;
    setTimeout(()=>document.getElementById('chat-input')?.focus(),550);
  },

  closeModal(){
    document.getElementById('side-modal').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow=''; this._modalOpen=false;
  },

  /* ── Settings ── */
  openSettings(){
    Render.settings();
    document.getElementById('settings-overlay').classList.add('open');
  },
  closeSettings(){
    document.getElementById('settings-overlay').classList.remove('open');
  },
  setProvider(key){
    const p=Config.getProviders()[key]; if(!p) return;
    Config.save({provider:key,model:p.models[0].id}); Render.settings();
  },
  toggleKeyVisibility(){
    const inp=document.getElementById('api-key-input');
    if(inp) inp.type=inp.type==='password'?'text':'password';
  },
  saveSettings(){
    const key=(document.getElementById('api-key-input')?.value||'').trim();
    const model=document.getElementById('model-select')?.value||'';
    Config.save({apiKey:key,model});
    this.closeSettings();
    showToast(key?'✓ API Key configurada. ¡Listo para debatir!':'Configuración guardada','🔑');
    if(this._modalOpen) Render.modal();
  },
  clearKey(){
    Config.save({apiKey:''}); Render.settings();
    showToast('API Key eliminada','🗑️');
    if(this._modalOpen) Render.modal();
  },

  /* ── Profile ── */
  openProfile(){
    Render.profile();
    document.getElementById('profile-overlay').classList.add('open');
  },
  closeProfile(){
    document.getElementById('profile-overlay').classList.remove('open');
  },

  /* ── Generator ── */
  openGenerator(){
    Render.generator();
    document.getElementById('generator-overlay').classList.add('open');
  },
  closeGenerator(){
    document.getElementById('generator-overlay').classList.remove('open');
    this._genTheme='';
  },
  selectTheme(t){
    this._genTheme=t;
    const inp=document.getElementById('gen-theme-input');
    if(inp) inp.value=t;
    document.querySelectorAll('.theme-chip').forEach(c=>c.classList.toggle('selected',c.textContent.trim()===t));
    AudioFX.click();
  },

  async generateDilemma(){
    const inp=document.getElementById('gen-theme-input');
    const theme=(inp?.value?.trim()||this._genTheme||'').trim();
    if(!theme){ showToast('Escribe un tema primero','✏️'); inp?.focus(); return; }

    const btn=document.getElementById('gen-btn');
    const status=document.getElementById('gen-status');
    if(btn){ btn.disabled=true; btn.innerHTML='<div class="gen-spinner"></div>Generando dilema…'; }
    if(status){ status.style.display='block'; status.innerHTML=`<p style="color:#34d399;font-size:12px;font-weight:500;text-align:center">✦ Construyendo dilema sobre "<em>${theme}</em>"…</p>`; }
    AudioFX.select();

    if(Config.hasKey()){
      // Real AI generation
      await LLM.generateDilemma(
        theme,
        (partial)=>{
          if(status) status.innerHTML=`<p style="color:#404060;font-size:11px;font-family:JetBrains Mono,monospace;max-height:60px;overflow:hidden">${partial.slice(-200)}</p>`;
        },
        (dilemma)=>{
          DB.addGenerated(dilemma);
          this.closeGenerator();
          const newIdx=DB.getAll().length-1;
          State.setIdx(newIdx); this._chatHistory=[]; this._chatIdx=0;
          Render.dilemma();
          showToast(`✦ Dilema generado: "${dilemma.title}"`, '🤖');
          AudioFX.victory();
        },
        (err)=>{
          if(btn){ btn.disabled=false; btn.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>Reintentar'; }
          if(status) status.innerHTML=`<p style="color:#f87171;font-size:12px;text-align:center">⚠ ${err.startsWith('parse:')?'Error al parsear la respuesta de la IA. Reintenta.':err}</p>`;
        }
      );
    } else {
      // Local template generation
      const usedIds=new Set(DB._generated.map(d=>d.id));
      const available=LOCAL_TEMPLATES.filter(t=>!usedIds.has(t.id));
      const tpl=available.length>0
        ? available[Math.floor(Math.random()*available.length)]
        : LOCAL_TEMPLATES[Math.floor(Math.random()*LOCAL_TEMPLATES.length)];

      await new Promise(r=>setTimeout(r,1400)); // Simulate generation time
      const dilemma={...tpl, id:tpl.id+'-'+Date.now(), _generated:true};
      DB.addGenerated(dilemma);
      this.closeGenerator();
      const newIdx=DB.getAll().length-1;
      State.setIdx(newIdx); this._chatHistory=[]; this._chatIdx=0;
      Render.dilemma();
      showToast(`✦ Dilema añadido: "${dilemma.title}"`, '📜');
      AudioFX.victory();
    }
  },

  /* ── Chat ── */
  async sendChat(){
    if(this._streaming) return;
    const all=DB.getAll(), {idx}=State.get(), d=all[idx];
    const choice=State.getChoice(d.id);
    const input=document.getElementById('chat-input'), msgs=document.getElementById('chat-messages');
    if(!input||!msgs) return;
    const text=input.value.trim(); if(!text) return;
    input.value=''; input.style.height='auto';

    const u=document.createElement('div');
    u.className='chat-user'; u.textContent=text;
    msgs.appendChild(u); msgs.scrollTop=msgs.scrollHeight;
    this._chatHistory.push({role:'user',content:text});

    const sysPrompt=choice
      ? LLM.buildSystemPrompt(d,choice)
      : `Eres un asesor histórico experto en ${d.category} del período ${d.year}. Responde de forma analítica y socrática en español.`;

    if(Config.hasKey()){
      this._streaming=true;
      const aiDiv=document.createElement('div');
      aiDiv.className='chat-ai'; aiDiv.innerHTML='<span class="s-cursor">▋</span>';
      msgs.appendChild(aiDiv); msgs.scrollTop=msgs.scrollHeight;
      let acc='';
      await LLM.send(
        this._chatHistory, sysPrompt,
        chunk=>{ acc+=chunk; aiDiv.innerHTML=parseMarkdown(acc)+'<span class="s-cursor">▋</span>'; msgs.scrollTop=msgs.scrollHeight; },
        ()=>{ aiDiv.innerHTML=parseMarkdown(acc); this._chatHistory.push({role:'assistant',content:acc}); this._streaming=false; msgs.scrollTop=msgs.scrollHeight; },
        err=>{ aiDiv.innerHTML=`<span style="color:#f87171;font-size:12px">⚠ ${err}</span>`; this._streaming=false; this._chatHistory.pop(); }
      );
    } else {
      // Demo mode typewriter
      const responses=d.chat.responses;
      const response=responses[this._chatIdx%responses.length]; this._chatIdx++;
      const typing=document.createElement('div');
      typing.className='chat-ai';
      typing.innerHTML='<span style="display:flex;gap:4px;align-items:center;padding:2px 0"><span class="typing-dot"></span><span class="typing-dot" style="animation-delay:.2s"></span><span class="typing-dot" style="animation-delay:.4s"></span></span>';
      msgs.appendChild(typing); msgs.scrollTop=msgs.scrollHeight;
      await new Promise(r=>setTimeout(r,700+Math.random()*500));
      typing.remove();
      const aiDiv=document.createElement('div'); aiDiv.className='chat-ai';
      msgs.appendChild(aiDiv); msgs.scrollTop=msgs.scrollHeight;
      LLM.typewriter(response,aiDiv,()=>{ this._chatHistory.push({role:'assistant',content:response}); msgs.scrollTop=msgs.scrollHeight; });
    }
  },

  chatKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.sendChat();} },
  chatResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,96)+'px'; },

  /* ── Share ── */
  shareVerdict(){
    const all=DB.getAll(), {idx,streak}=State.get(), d=all[idx], choice=State.getChoice(d.id);
    if(!choice){ showToast('Primero elige una opción','⚠️'); return; }
    const ok=choice===d.revelation.historicalChoice;
    const pA=d.options.A.pct, pB=d.options.B.pct;
    const bar=n=>'█'.repeat(Math.round(n/10))+'░'.repeat(10-Math.round(n/10));
    const txt=[
      `🧠 Dopaminapp Elite — Dilema del Día`,`━━━━━━━━━━━━━━━━`,
      `📌 ${d.category} · ${d.year}`,`${d.icon} ${d.title}`,``,
      `Mi veredicto: ${choice==='A'?'🔵':'🟡'} ${d.options[choice].label} (${choice})`,
      ok?`✅ Acerté con la decisión histórica`:`❌ No acerté — fue "${d.revelation.choiceLabel}"`,``,
      `📊 La comunidad eligió:`,`🔵 A  ${bar(pA)} ${pA}%`,`🟡 B  ${bar(pB)} ${pB}%`,``,
      `🔥 Racha: ${streak.count} días | ⭐ ${Profile.compute()?.archetype?.name||'Sin arquetipo aún'}`,`dopaminapp.io`,
    ].join('\n');
    const copy=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);};
    (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>showToast('¡Veredicto copiado!','📋')).catch(()=>{copy();showToast('¡Veredicto copiado!','📋');});
  },

  /* ── Keyboard Shortcuts ── */
  _bindKeys(){
    document.addEventListener('keydown',e=>{
      if(e.target.matches('input,textarea,select')) return;
      if(e.metaKey||e.ctrlKey||e.altKey) return;
      const all=DB.getAll(), {idx}=State.get(), d=all[idx], done=State.isDone(d.id);
      switch(e.key){
        case '1': if(!done){ this.selectOption('A'); } break;
        case '2': if(!done){ this.selectOption('B'); } break;
        case ' ': e.preventDefault(); this._modalOpen?this.closeModal():this.openModal(); break;
        case 'Escape':
          if(document.getElementById('settings-overlay').classList.contains('open')) this.closeSettings();
          else if(document.getElementById('profile-overlay').classList.contains('open')) this.closeProfile();
          else if(document.getElementById('generator-overlay').classList.contains('open')) this.closeGenerator();
          else this.closeModal();
          break;
        case 'ArrowRight': this.navigate(1); break;
        case 'ArrowLeft':  this.navigate(-1); break;
      }
    });
  },

  /* ── Mobile Viewport (keyboard handling) ── */
  _bindMobileViewport(){
    if(!window.visualViewport) return;
    const handle=()=>{
      const modal=document.getElementById('side-modal');
      if(!modal?.classList.contains('open')) return;
      modal.style.height=window.visualViewport.height+'px';
      modal.style.top=window.visualViewport.offsetTop+'px';
      const msgs=document.getElementById('chat-messages');
      if(msgs) setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
    };
    window.visualViewport.addEventListener('resize',handle);
    window.visualViewport.addEventListener('scroll',handle);
  },
};

document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
</html>
