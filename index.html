<script>
'use strict';

/* ── HELPERS ──────────────────────────────────────────────── */
function stripHtml(s) { return s.replace(/<[^>]+>/g,''); }

function parseMarkdown(text) {
  // Escape HTML that may come from AI
  let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Bold / Italic
  h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
  // Inline code
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  // Bullet lists
  const lines = h.split('\n');
  let out=[], inList=false;
  for (const ln of lines) {
    if (/^[-•]\s/.test(ln)) {
      if (!inList) { out.push('<ul>'); inList=true; }
      out.push(`<li>${ln.slice(2)}</li>`);
    } else {
      if (inList) { out.push('</ul>'); inList=false; }
      out.push(ln);
    }
  }
  if (inList) out.push('</ul>');
  // Paragraphs (double newline)
  return out.join('\n').replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');
}

function showToast(text, icon='✓', ms=2800) {
  const el=document.getElementById('toast-inner');
  document.getElementById('toast-icon').textContent=icon;
  document.getElementById('toast-text').textContent=text;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>el.classList.remove('show'),ms);
}


/* ═══════════════════════════════════════════════════════════
   MODULE: CONFIG (BYOK)
═══════════════════════════════════════════════════════════ */
const Config = (() => {
  const KEY = 'dopaminapp_v3_config';
  const PROVIDERS = {
    gemini: {
      name:'Google Gemini', emoji:'🔷',
      models:[
        {id:'gemini-1.5-flash',      name:'Gemini 1.5 Flash (Recomendado)'},
        {id:'gemini-2.0-flash-exp',  name:'Gemini 2.0 Flash (Experimental)'},
        {id:'gemini-1.5-pro',        name:'Gemini 1.5 Pro (Avanzado)'},
      ],
      keyUrl:'https://aistudio.google.com/app/apikey',
      keyPlaceholder:'AIzaSy...',
    },
    openai: {
      name:'OpenAI', emoji:'⬛',
      models:[
        {id:'gpt-4o-mini', name:'GPT-4o Mini (Rápido)'},
        {id:'gpt-4o',      name:'GPT-4o (Avanzado)'},
      ],
      keyUrl:'https://platform.openai.com/api-keys',
      keyPlaceholder:'sk-proj-...',
    },
  };

  let cfg = { provider:'gemini', model:'gemini-1.5-flash', apiKey:'' };

  function load() {
    try { const r=localStorage.getItem(KEY); if(r) cfg={...cfg,...JSON.parse(r)}; } catch(_){}
    return cfg;
  }
  function save(updates) {
    cfg={...cfg,...updates};
    try { localStorage.setItem(KEY,JSON.stringify(cfg)); } catch(_){}
  }
  function get() { return cfg; }
  function hasKey() { return !!cfg.apiKey?.trim(); }
  function getProviders() { return PROVIDERS; }
  function getProvider() { return PROVIDERS[cfg.provider] || PROVIDERS.gemini; }

  return { load, save, get, hasKey, getProviders, getProvider };
})();


/* ═══════════════════════════════════════════════════════════
   MODULE: LLM  (Gemini + OpenAI streaming)
═══════════════════════════════════════════════════════════ */
const LLM = {

  buildSystemPrompt(d, userChoice) {
    const opt   = d.options[userChoice];
    const rev   = d.revelation;
    const ok    = userChoice === rev.historicalChoice;
    const ctx   = stripHtml(d.context);
    const cExp  = stripHtml(rev.conceptExp);

    return `Eres un asesor intelectual del período histórico ${d.year} especializado en ${d.category}. Tu rol es el de un pensador crítico y socrático — NO un asistente complaciente.

CONTEXTO DEL DILEMA (${d.year}, ${d.country}):
${ctx}

EL USUARIO ELIGIÓ: Opción ${userChoice} — "${opt.label}": ${opt.desc}

LO QUE OCURRIÓ HISTÓRICAMENTE: ${rev.actor} eligió la Opción ${rev.historicalChoice} — "${rev.choiceLabel}". ${stripHtml(rev.text)}

CONCEPTO CLAVE: ${rev.concept} — ${cExp}

${ok
  ? `EL USUARIO ACERTÓ. Tu misión: NO solo validarlo. Desafíalo con los COSTOS COLATERALES reales de esta decisión. ¿Qué se sacrificó? ¿Quién pagó el precio? ¿Podría haber salido mal? Explora la complejidad moral y las consecuencias no previstas.`
  : `EL USUARIO NO ACERTÓ. Eligió "${opt.label}" pero la historia eligió "${rev.choiceLabel}". Tu misión: rebatirlo con argumentos históricos concretos y desafiantes. Explica la lógica detrás de la decisión real. Hazle ver por qué su intuición, aunque comprensible, no refleja la realidad histórica.`
}

REGLAS ESTRICTAS:
- Máximo 3 párrafos concisos y densos. Sin relleno.
- Usa **negritas** para conceptos clave.
- Termina SIEMPRE con una pregunta socrática provocadora que obligue a reflexionar.
- NUNCA uses frases genéricas de asistente ("¡Claro!", "¡Excelente pregunta!", "¡Buena observación!").
- Habla con convicción analítica, como un historiador que conoce los hechos.
- Si el usuario hace preguntas off-topic, redirígelas al dilema con inteligencia.
- Responde siempre en español.`;
  },

  async _readStream(response, onChunk, onDone, onError, parseChunk) {
    try {
      const reader  = response.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) { onDone(); break; }
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop(); // Keep incomplete line
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') { onDone(); return; }
          if (!data) continue;
          try {
            const chunk = parseChunk(JSON.parse(data));
            if (chunk) onChunk(chunk);
          } catch(_) {}
        }
      }
    } catch(e) { onError(e.message); }
  },

  async streamGemini(cfg, messages, systemPrompt, onChunk, onDone, onError) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:streamGenerateContent?alt=sse&key=${cfg.apiKey}`;
    const contents = messages.map(m=>({ role: m.role==='assistant'?'model':'user', parts:[{text:m.content}] }));
    let res;
    try {
      res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          systemInstruction:{ parts:[{text:systemPrompt}] },
          contents,
          generationConfig:{ temperature:0.85, maxOutputTokens:700 },
        })
      });
    } catch(e) { onError('Error de red: '+e.message); return; }
    if (!res.ok) {
      const err = await res.json().catch(()=>({error:{message:'Error '+res.status}}));
      onError(err.error?.message || 'Error '+res.status); return;
    }
    await this._readStream(res, onChunk, onDone, onError,
      j => j.candidates?.[0]?.content?.parts?.[0]?.text
    );
  },

  async streamOpenAI(cfg, messages, systemPrompt, onChunk, onDone, onError) {
    let res;
    try {
      res = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},
        body:JSON.stringify({
          model: cfg.model, stream: true,
          messages:[{role:'system',content:systemPrompt},...messages],
          max_tokens:700, temperature:0.85,
        })
      });
    } catch(e) { onError('Error de red: '+e.message); return; }
    if (!res.ok) {
      const err = await res.json().catch(()=>({error:{message:'Error '+res.status}}));
      onError(err.error?.message || 'Error '+res.status); return;
    }
    await this._readStream(res, onChunk, onDone, onError,
      j => j.choices?.[0]?.delta?.content
    );
  },

  async send(messages, systemPrompt, onChunk, onDone, onError) {
    const cfg = Config.get();
    if (cfg.provider === 'openai') {
      await this.streamOpenAI(cfg, messages, systemPrompt, onChunk, onDone, onError);
    } else {
      await this.streamGemini(cfg, messages, systemPrompt, onChunk, onDone, onError);
    }
  },

  typewriter(text, element, onDone, speed=18) {
    const chars = [...text];
    let i = 0;
    function tick() {
      if (i < chars.length) {
        element.textContent += chars[i++];
        setTimeout(tick, speed + Math.random()*12);
      } else {
        element.innerHTML = parseMarkdown(text);
        if (onDone) onDone();
      }
    }
    tick();
  },
};

/* ═══════════════════════════════════════════════════════════
   MODULE: STATE MANAGEMENT
═══════════════════════════════════════════════════════════ */
const State = (() => {
  const KEY = 'dopaminapp_v2_state';
  let s = { idx:0, completed:{}, streak:{count:0,last:null} };
  function _today() { return new Date().toISOString().slice(0,10); }
  function load() {
    try { const r=localStorage.getItem(KEY); if(r) s={...s,...JSON.parse(r)}; } catch(_){}
    if (s.streak.last) {
      const diff=(new Date(_today())-new Date(s.streak.last))/86400000;
      if(diff>1){ s.streak.count=0; s.streak.last=null; _save(); }
    }
    return s;
  }
  function _save() { try { localStorage.setItem(KEY,JSON.stringify(s)); } catch(_){} }
  function complete(id,choice) {
    if(s.completed[id]) return;
    s.completed[id]={choice,ts:Date.now()};
    const today=_today();
    if(s.streak.last!==today){ s.streak.count++; s.streak.last=today; }
    _save();
  }
  function isDone(id)    { return !!s.completed[id]; }
  function getChoice(id) { return s.completed[id]?.choice||null; }
  function get()         { return s; }
  function setIdx(i)     { s.idx=i; _save(); }
  function reset()       { s={idx:0,completed:{},streak:{count:0,last:null}}; _save(); }
  return { load, complete, isDone, getChoice, get, setIdx, reset };
})();

      <div id="revelation-area">${done?this._revelation(d,choice):''}</div>

      <div style="display:flex;justify-content:space-between;margin-top:24px">
        <button onclick="App.navigate(-1)" style="display:flex;align-items:center;gap:7px;font-size:13px;color:#404060;padding:8px 12px;border-radius:9px;border:none;background:transparent;cursor:pointer;transition:all .2s;${idx===0?'opacity:.25;pointer-events:none':''}" onmouseover="this.style.color='#c0c0e0';this.style.background='#141420'" onmouseout="this.style.color='#404060';this.style.background='transparent'">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8 2L4 6.5L8 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Anterior
        </button>
        <button onclick="App.navigate(1)" style="display:flex;align-items:center;gap:7px;font-size:13px;color:#404060;padding:8px 12px;border-radius:9px;border:none;background:transparent;cursor:pointer;transition:all .2s;${idx===DB.dilemmas.length-1?'opacity:.25;pointer-events:none':''}" onmouseover="this.style.color='#c0c0e0';this.style.background='#141420'" onmouseout="this.style.color='#404060';this.style.background='transparent'">
          Siguiente<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 2l4 4.5L5 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>`;

    this.header();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const c=document.getElementById('dilemma-card');
      if(c){c.style.opacity='1';c.style.transform='translateY(0)';}
    }));
    if(done) this._animateBars(d);
  },

  _optionsActive(d) {
    return `<p class="label-xs" style="color:#2a2a42;margin-bottom:14px">¿Cuál es tu decisión? <kbd>1</kbd> <kbd>2</kbd></p>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${['A','B'].map(opt=>{const o=d.options[opt],col=opt==='A'?'#4f8ef7':'#f5a623';return`
        <button id="opt-${opt}" onclick="App.selectOption('${opt}')" class="opt-btn opt-${opt}" aria-label="Opción ${opt}: ${o.label}">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <span class="opt-badge" style="background:${col}12;border-color:${col}28;color:${col};margin-top:1px">${opt}</span>
            <div><p style="color:#e8e8f8;font-weight:600;font-size:14px">${o.label}</p>
            <p style="color:#484868;font-size:13px;margin-top:4px;line-height:1.55">${o.desc}</p></div>
          </div>
        </button>`;}).join('')}
    </div>`;
  },

  _optionsDone(d,choice) {
    return `<div style="display:flex;flex-direction:column;gap:10px">
      ${['A','B'].map(opt=>{
        const o=d.options[opt],pct=o.pct,col=opt==='A'?'#4f8ef7':'#f5a623';
        const isChosen=choice===opt, isHist=d.revelation.historicalChoice===opt;
        return`<div class="opt-result" style="${isChosen?`background:${col}07;border-color:${col}28`:'background:#080810;border-color:#111120'}">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="opt-badge" style="background:${col}12;border:1px solid ${col}28;color:${col}">${opt}</span>
              <span style="color:#d0d0f0;font-weight:600;font-size:14px">${o.label}</span>
              ${isChosen?`<span class="label-xs" style="background:${col}12;border:1px solid ${col}22;color:${col};padding:2px 7px;border-radius:999px">Tu elección</span>`:''}
              ${isHist?`<span class="label-xs" style="background:#34d39912;border:1px solid #34d39928;color:#34d399;padding:2px 7px;border-radius:999px">✓ Histórico</span>`:''}
            </div>
            <span class="mono-val" style="font-size:22px;color:${col}" id="pct-${opt}-num">0%</span>
          </div>
          <p style="color:#383858;font-size:13px;margin-bottom:10px;line-height:1.5">${o.desc}</p>
          <div class="pct-track"><div class="pct-fill" id="pct-${opt}-bar" data-target="${pct}" style="background:linear-gradient(90deg,${col},${col}88)"></div></div>
        </div>`;
      }).join('')}
    </div>`;
  },

  _animateBars(d) {
    ['A','B'].forEach(opt=>{
      const bar=document.getElementById(`pct-${opt}-bar`),num=document.getElementById(`pct-${opt}-num`);
      if(!bar||!num) return;
      const target=parseInt(bar.dataset.target);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width=target+'%';}));
      let start=null; const dur=1300;
      function step(ts){
        if(!start) start=ts;
        const p=Math.min((ts-start)/dur,1),e=1-Math.pow(1-p,4);
        num.textContent=Math.round(e*target)+'%';
        if(p<1) requestAnimationFrame(step); else num.textContent=target+'%';
      }
      setTimeout(()=>requestAnimationFrame(step),80);
    });
  },

/* ═══════════════════════════════════════════════════════════
   MODULE: APP CONTROLLER
═══════════════════════════════════════════════════════════ */
const App = {
  _chatIdx: 0,
  _modalOpen: false,
  _settingsOpen: false,
  _chatHistory: [],   // [{role:'user'|'assistant', content:'...'}]
  _streaming: false,
  _currentProvider: 'gemini',

  init() {
    State.load();
    Config.load();
    Render.dilemma();
    this._bindKeys();
    this._bindMobileViewport();
  },

  goTo(i) {
    if(i===State.get().idx) return;
    State.setIdx(i); this._chatIdx=0; this._chatHistory=[];
    Render.dilemma();
  },

  navigate(dir) {
    const {idx}=State.get(), next=idx+dir;
    if(next<0||next>=DB.dilemmas.length) return;
    this.goTo(next);
  },

  selectOption(opt) {
    const {idx}=State.get(), d=DB.dilemmas[idx];
    if(State.isDone(d.id)) return;
    State.complete(d.id,opt);
    const optArea=document.getElementById('options-area'), revArea=document.getElementById('revelation-area');
    if(!optArea||!revArea) return;
    optArea.style.transition='opacity .22s'; optArea.style.opacity='0';
    setTimeout(()=>{
      optArea.innerHTML=Render._optionsDone(d,opt); optArea.style.opacity='1';
      Render._animateBars(d);
      revArea.innerHTML=Render._revelation(d,opt);
      Render.header();
      const ok=opt===d.revelation.historicalChoice;
      showToast(ok?`¡Acertaste con la decisión de ${d.revelation.actor}!`:'Interesante — ve la revelación histórica', ok?'🎯':'📖');
    },230);
  },

  openModal() {
    if(!State.isDone(DB.dilemmas[State.get().idx].id)){
      showToast('Primero elige una opción','🔒'); return;
    }
    this._chatHistory=[]; this._chatIdx=0;
    Render.modal();
    document.getElementById('side-modal').classList.add('open');
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow='hidden';
    this._modalOpen=true;
    setTimeout(()=>document.getElementById('chat-input')?.focus(),550);
  },

  closeModal() {
    document.getElementById('side-modal').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow=''; this._modalOpen=false;
  },

  /* ── Settings ── */
  openSettings() {
    Render.settings();
    document.getElementById('settings-overlay').classList.add('open');
    this._settingsOpen=true;
  },

  closeSettings() {
    document.getElementById('settings-overlay').classList.remove('open');
    this._settingsOpen=false;
  },

  setProvider(key) {
    const providers=Config.getProviders();
    const p=providers[key]; if(!p) return;
    Config.save({provider:key, model:p.models[0].id});
    Render.settings(); // Re-render with new provider
  },

  toggleKeyVisibility() {
    const inp=document.getElementById('api-key-input');
    if(inp) inp.type=inp.type==='password'?'text':'password';
  },

  saveSettings() {
    const key=(document.getElementById('api-key-input')?.value||'').trim();
    const model=document.getElementById('model-select')?.value||'';
    Config.save({apiKey:key, model});
    this.closeSettings();
    showToast(key?'✓ API Key configurada. ¡Listo para debatir!':'Configuración guardada sin API Key','🔑');
    // Refresh modal chat header if open
    if(this._modalOpen) Render.modal();
  },

  clearKey() {
    Config.save({apiKey:''});
    Render.settings();
    showToast('API Key eliminada','🗑️');
    if(this._modalOpen) Render.modal();
  },

  /* ── Chat ── */
  async sendChat() {
    if(this._streaming) return;
    const {idx}=State.get(), d=DB.dilemmas[idx], choice=State.getChoice(d.id);
    const input=document.getElementById('chat-input'), msgs=document.getElementById('chat-messages');
    if(!input||!msgs) return;

    const text=input.value.trim(); if(!text) return;
    input.value=''; input.style.height='auto';

    // User bubble
    const u=document.createElement('div');
    u.className='chat-user'; u.style.fontSize='12.5px'; u.textContent=text;
    msgs.appendChild(u); msgs.scrollTop=msgs.scrollHeight;

    // Add to history
    this._chatHistory.push({role:'user', content:text});

    // Build system prompt
    const systemPrompt = choice
      ? LLM.buildSystemPrompt(d, choice)
      : `Eres un asesor histórico experto en ${d.category} del período ${d.year}. Responde de forma analítica, breve y socrática. Responde siempre en español.`;

    if(Config.hasKey()) {
      // ── REAL API (streaming) ──
      this._streaming=true;
      const aiDiv=document.createElement('div');
      aiDiv.className='chat-ai'; aiDiv.style.fontSize='12.5px';
      aiDiv.innerHTML='<span class="s-cursor">▋</span>';
      msgs.appendChild(aiDiv); msgs.scrollTop=msgs.scrollHeight;

      let accumulated='';

      await LLM.send(
        this._chatHistory,
        systemPrompt,
        (chunk) => {
          accumulated+=chunk;
          aiDiv.innerHTML=parseMarkdown(accumulated)+'<span class="s-cursor">▋</span>';
          msgs.scrollTop=msgs.scrollHeight;
        },
        () => {
          aiDiv.innerHTML=parseMarkdown(accumulated);
          this._chatHistory.push({role:'assistant', content:accumulated});
          this._streaming=false;
          msgs.scrollTop=msgs.scrollHeight;
        },
        (err) => {
          aiDiv.innerHTML=`<span style="color:#f87171;font-size:12px">⚠ ${err}</span>`;
          this._streaming=false;
          // Remove failed message from history
          this._chatHistory.pop();
        }
      );
    } else {
      // ── DEMO MODE (typewriter) ──
      const responses=d.chat.responses;
      const response=responses[this._chatIdx % responses.length];
      this._chatIdx++;

      // Typing indicator
      const typing=document.createElement('div');
      typing.className='chat-ai'; typing.style.fontSize='12px';
      typing.innerHTML='<span style="display:flex;gap:4px;align-items:center;padding:2px 0"><span class="typing-dot"></span><span class="typing-dot" style="animation-delay:.2s"></span><span class="typing-dot" style="animation-delay:.4s"></span></span>';
      msgs.appendChild(typing); msgs.scrollTop=msgs.scrollHeight;

      await new Promise(r=>setTimeout(r, 800+Math.random()*600));
      typing.remove();

      const aiDiv=document.createElement('div');
      aiDiv.className='chat-ai'; aiDiv.style.fontSize='12.5px';
      msgs.appendChild(aiDiv); msgs.scrollTop=msgs.scrollHeight;

      LLM.typewriter(response, aiDiv, ()=>{
        this._chatHistory.push({role:'assistant', content:response});
        msgs.scrollTop=msgs.scrollHeight;
      });
    }
  },

  chatKey(e)     { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); this.sendChat();} },
  chatResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,96)+'px'; },

  /* ── Share ── */
  shareVerdict() {
    const {idx,streak}=State.get(), d=DB.dilemmas[idx], choice=State.getChoice(d.id);
    if(!choice){ showToast('Primero elige una opción','⚠️'); return; }
    const ok=choice===d.revelation.historicalChoice;
    const pA=d.options.A.pct, pB=d.options.B.pct;
    const bar=n=>'█'.repeat(Math.round(n/10))+'░'.repeat(10-Math.round(n/10));
    const txt=[
      `🧠 Dopaminapp — Dilema del Día`,`━━━━━━━━━━━━━━━━`,
      `📌 ${d.category} · ${d.year}`,`${d.icon} ${d.title}`,``,
      `Mi veredicto: ${choice==='A'?'🔵':'🟡'} ${d.options[choice].label} (${choice})`,
      ok?`✅ Acerté con la decisión histórica`:`❌ No acerté — fue "${d.revelation.choiceLabel}"`,``,
      `📊 La comunidad eligió:`,`🔵 A  ${bar(pA)} ${pA}%`,`🟡 B  ${bar(pB)} ${pB}%`,``,
      `🔥 Racha: ${streak.count} días`,`dopaminapp.io`,
    ].join('\n');
    const copy=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);};
    (navigator.clipboard?.writeText(txt)||Promise.reject())
      .then(()=>showToast('¡Veredicto copiado!','📋'))
      .catch(()=>{copy();showToast('¡Veredicto copiado!','📋');});
  },

  /* ── Keyboard shortcuts ── */
  _bindKeys() {
    document.addEventListener('keydown', e=>{
      if(e.target.matches('input,textarea,select')) return;
      if(e.metaKey||e.ctrlKey||e.altKey) return;
      const {idx}=State.get(), d=DB.dilemmas[idx], done=State.isDone(d.id);
      switch(e.key){
        case '1': if(!done) this.selectOption('A'); break;
        case '2': if(!done) this.selectOption('B'); break;
        case ' ': e.preventDefault(); this._modalOpen?this.closeModal():this.openModal(); break;
        case 'Escape': this._settingsOpen?this.closeSettings():this.closeModal(); break;
        case 'ArrowRight': this.navigate(1); break;
        case 'ArrowLeft':  this.navigate(-1); break;
      }
    });
  },

  /* ── Mobile viewport (keyboard handling) ── */
  _bindMobileViewport() {
    if(!window.visualViewport) return;
    window.visualViewport.addEventListener('resize', ()=>{
      const modal=document.getElementById('side-modal');
      if(!modal?.classList.contains('open')) return;
      // Shrink modal to visual viewport height (avoids keyboard overlap)
      modal.style.height=window.visualViewport.height+'px';
      modal.style.top=window.visualViewport.offsetTop+'px';
      // Scroll chat to bottom
      const msgs=document.getElementById('chat-messages');
      if(msgs) setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
    });
    window.visualViewport.addEventListener('scroll', ()=>{
      const modal=document.getElementById('side-modal');
      if(modal?.classList.contains('open'))
        modal.style.top=window.visualViewport.offsetTop+'px';
    });
  },
};

document.addEventListener('DOMContentLoaded', ()=>App.init());
</script>
</body>
</html>
